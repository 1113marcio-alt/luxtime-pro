  <style>
    :root {
      --bg: #090d16;
      --card: #131c2e;
      --card-alt: #1a263d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #f43f5e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
      overflow-x: hidden;
      user-select: none;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 700;
    }
    .bg-sky { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
    .bg-emerald { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .bg-amber { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .bg-purple { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; }
    .bg-rose { background: rgba(244, 63, 94, 0.15); color: #fda4af; }

    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input, select, textarea {
      width: 100%; background: var(--card-alt); color: var(--text);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      padding: 10px 12px; font-size: 13px; font-weight: 600; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    button {
      border: none; border-radius: 12px; padding: 11px 14px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    button:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #082f49; width: 100%; font-weight: 800; }
    .btn-success { background: linear-gradient(135deg, #34d399, #059669); color: #022c22; font-weight: 800; }
    .btn-danger { background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }
    .btn-ghost { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); }

    /* Barra de Navegação Inferior estilo One UI Samsung */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 999;
    }
    .nav-item {
      background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px; border-radius: 12px; font-size: 10px; font-weight: 700;
    }
    .nav-item.active { color: var(--primary); background: rgba(56, 189, 248, 0.12); }
    .nav-icon { font-size: 18px; line-height: 1; }

    /* Grelha do Calendário */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 8px; }
    .cal-head { text-align: center; font-size: 10px; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .cal-day {
      background: var(--card-alt); border: 1px solid var(--border);
      border-radius: 10px; min-height: 54px; padding: 4px;
      display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; position: relative;
    }
    .cal-day.selected { border: 2px solid var(--primary); }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-num { font-size: 11px; font-weight: 800; }
    .cal-tag { font-size: 9px; font-weight: 700; padding: 1px 3px; border-radius: 4px; text-align: center; white-space: nowrap; overflow: hidden; }

    /* Barra de Progresso */
    .progress-bar { width: 100%; height: 8px; background: #0f172a; border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }

    /* Linha divisória */
    .divider { height: 1px; background: var(--border); margin: 10px 0; }
    .kpi-val { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; margin-top: 2px; }
    .subtext { font-size: 11px; color: var(--muted); }
  </style>
</head>

    // ==================== FERIADOS AUTOMÁTICOS POR ANO ====================
    function getEasterDate(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }
    function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
    function fmtISO(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

      const whitMon = fmtISO(addDays(easter, 50));

      const corpus = fmtISO(addDays(easter, 60));

          { date: `${year}-12-25`, name: "Natal" }
        ];
      }
      return [

        { date: easterMon, name: "Segunda de Páscoa" },
        { date: `${year}-05-01`, name: "1.º de Maio" },

        { date: `${year}-12-25`, name: "Natal" },
        { date: `${year}-12-26`, name: "26 de Dezembro" }

    // ==================== CÁLCULO DE HORAS & NOTURNAS (22h-06h) ====================
    function calcShiftFromTimes(startStr, endStr, breakMin, stdHours, dateStr) {
      if (!startStr || !endStr) return { normalH: stdHours, extraH: 0, nightH: 0, sundayH: 0 };
      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      let startMin = sh * 60 + sm;
      let endMin = eh * 60 + em;
      if (endMin <= startMin) endMin += 24 * 60;

      const totalWorkedMin = Math.max(0, (endMin - startMin) - Number(breakMin || 0));
      const totalH = +(totalWorkedMin / 60).toFixed(2);
      const normalH = Math.min(stdHours, totalH);
      const extraH = +(Math.max(0, totalH - stdHours)).toFixed(2);

      let nightMin = 0;
      for (let m = startMin; m < endMin; m++) {
        const clockMin = m % (24 * 60);
        if (clockMin >= 22 * 60 || clockMin < 6 * 60) nightMin++;
      }
      const nightH = +(nightMin / 60).toFixed(2);
      const isSun = dateStr ? (new Date(dateStr + 'T12:00:00').getDay() === 0) : false;
      const sundayH = isSun ? totalH : 0;

      return { normalH, extraH, nightH, sundayH };
    }

    // ==================== MOTOR SALARIAL E MÉDIA DOS 3 MESES ====================
    function getPrevious3Months(ym) {
      const [y, m] = ym.split('-').map(Number);
      const res = [];
      for (let i = 1; i <= 3; i++) {
        const d = new Date(y, m - 1 - i, 1);
        res.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      }
      return res;
    }

    function computeRowGross(entry, congeRateForMonth) {
      const base = Number(state.baseRate);
      const bonus = Number(state.hourlyBonus);
      const rateWithBonus = base + bonus;
      const otBaseRate = base * (1 + Number(state.otSupplementPct) / 100) + (state.includeBonusInOt ? bonus : 0);

      if (entry.type === 'baixa' || entry.type === 'recupera') {
        return { gross: 0, otGross: 0, bonusTotal: 0, hoursCounted: 0 };
      }
      if (entry.type === 'conge') {
        const h = Number(entry.normalH || state.standardDailyHours);
        return { gross: h * congeRateForMonth, otGross: 0, bonusTotal: 0, hoursCounted: h };
      }
      if (entry.type === 'feriado_chome') {
        const h = Number(entry.normalH || state.standardDailyHours);
        const r = base + (state.includeBonusInUnworkedHoliday ? bonus : 0);
        return { gross: h * r, otGross: 0, bonusTotal: state.includeBonusInUnworkedHoliday ? h * bonus : 0, hoursCounted: h };
      }
      if (entry.type === 'feriado_trab') {
        const h = Number(entry.normalH || state.standardDailyHours);
        const holChome = h * (base + (state.includeBonusInUnworkedHoliday ? bonus : 0));
        const worked = h * rateWithBonus;
        const maj100 = h * base * (Number(state.holidaySupplementPct) / 100);
        return {
          gross: holChome + worked + maj100,
          otGross: maj100,
          bonusTotal: h * bonus * (state.includeBonusInUnworkedHoliday ? 2 : 1),
          hoursCounted: h
        };
      }

      const nh = Number(entry.normalH || 0);
      const eh = entry.otMode === 'pay' ? Number(entry.extraH || 0) : 0;
      const nightH = Number(entry.nightH || 0);
      const sunH = Number(entry.sundayH || 0);

      const normalPay = nh * rateWithBonus;
      const otPay = eh * otBaseRate;
      const nightPay = nightH * base * (Number(state.nightSupplementPct) / 100);
      const sunPay = sunH * base * (Number(state.sundaySupplementPct) / 100);
      const bonusTotal = (nh * bonus) + (state.includeBonusInOt ? eh * bonus : 0);

      return {
        gross: normalPay + otPay + nightPay + sunPay,
        otGross: otPay + nightPay + sunPay,
        bonusTotal,
        hoursCounted: nh + eh
      };
    }

    function getCongeRateDetails(ym) {
      const prev3 = getPrevious3Months(ym);
      let totalGross = 0, totalHours = 0;
      prev3.forEach(m => {
        const list = state.entries[m] || [];
        list.forEach(e => {
          const r = computeRowGross(e, Number(state.manualCongeRate));
          totalGross += r.gross;
          totalHours += r.hoursCounted;
        });
      });
      const isAuto = totalHours >= 24;
      const rate = isAuto ? +(totalGross / totalHours).toFixed(2) : Number(state.manualCongeRate);
      return { rate, isAuto, totalGross: +totalGross.toFixed(2), totalHours: +totalHours.toFixed(2), prev3 };
    }

    function getEffectiveMonthEntries(ym) {
      const manual = [...(state.entries[ym] || [])];
      const [year] = ym.split('-').map(Number);
      const holidays = getPublicHolidays(year, state.country).filter(h => h.date.startsWith(ym));

      if (state.autoPayUnworkedHolidays) {
        holidays.forEach(h => {
          const d = new Date(h.date + 'T12:00:00');
          const dow = d.getDay();
          const alreadyLogged = manual.some(e => e.date === h.date);
          if (!alreadyLogged && dow >= 1 && dow <= 5) {
            manual.push({
              date: h.date, type: 'feriado_chome', start: '-', end: '-',
              breakMin: 0, normalH: state.standardDailyHours, extraH: 0, nightH: 0, sundayH: 0,
              otMode: 'pay', expense: 0, note: h.name, isAutoHoliday: true
            });
          }
        });
      }
      return manual.sort((a, b) => a.date.localeCompare(b.date));
    }

    function calculateMonthSummary(ym) {
      const profile = state.countryProfiles[state.country];
      const congeInfo = getCongeRateDetails(ym);
      const congeRate = congeInfo.rate;
      const list = getEffectiveMonthEntries(ym);

      let totalGross = Number(state.extraMonthlyBonusGross || 0);
      let totalOtAndSupplements = 0, totalBonusEarned = 0;
      let totalNormalHours = 0, totalPaidExtraHours = 0;
      let workedDaysForVouchers = 0, congeDaysCount = 0;
      let unworkedHolidayHours = 0, unworkedHolidayPay = 0, totalExpensesReimb = 0;

      list.forEach(e => {
        const r = computeRowGross(e, congeRate);
        totalGross += r.gross;
        totalOtAndSupplements += r.otGross;
        totalBonusEarned += r.bonusTotal;
        totalExpensesReimb += Number(e.expense || 0);

        if (e.type === 'work' || e.type === 'feriado_trab') {
          totalNormalHours += Number(e.normalH || 0);
          workedDaysForVouchers++;
          if (e.otMode === 'pay') totalPaidExtraHours += Number(e.extraH || 0);
        } else if (e.type === 'conge') {
          congeDaysCount++;
        } else if (e.type === 'feriado_chome') {
          unworkedHolidayHours += Number(e.normalH || state.standardDailyHours);
          unworkedHolidayPay += r.gross;
        }
      });

      // Contadores Anuais (Férias usadas no ano & Banco de Horas acumulado)
      const [year] = ym.split('-').map(Number);
      let annualCongeUsed = 0;
      let totalReposBankHours = 0;
      Object.keys(state.entries).forEach(monthKey => {
        const mList = state.entries[monthKey] || [];
        mList.forEach(item => {
          if (monthKey.startsWith(String(year)) && item.type === 'conge') annualCongeUsed++;
          if (item.otMode === 'bank') totalReposBankHours += Number(item.extraH || 0);
          if (item.type === 'recupera') totalReposBankHours -= Number(item.normalH || state.standardDailyHours);
        });
      });

      const regularGross = Math.max(0, totalGross - totalOtAndSupplements);
      const deductionBreakdown = [];
      let totalSocialDeductions = 0;

      profile.deductions.forEach(d => {
        let base = d.onOt ? totalGross : regularGross;
        if (d.allowance) base = Math.max(0, totalGross - Number(d.allowance));
        const val = +(base * (Number(d.rate) / 100)).toFixed(2);
        totalSocialDeductions += val;
        deductionBreakdown.push({ label: d.label, rate: d.rate, amount: val });
      });

      const taxableGross = profile.otTaxExempt
        ? Math.max(0, regularGross - totalSocialDeductions)
        : Math.max(0, totalGross - totalSocialDeductions);

      const estimatedTax = +(taxableGross * (Number(profile.taxRate) / 100)).toFixed(2);
      const vouchersCount = Math.min(Number(profile.mealVoucherMax || 0), workedDaysForVouchers);
      const voucherDeduction = +(vouchersCount * Number(profile.mealVoucherCost || 0)).toFixed(2);
      const cis = Number(profile.cisCredit || 0);

      const netSalary = +(totalGross - totalSocialDeductions - estimatedTax - voucherDeduction + cis + totalExpensesReimb).toFixed(2);

      const yearHolidays = getPublicHolidays(year, state.country);
      const weekendHolidays = yearHolidays.filter(h => {
        const dow = new Date(h.date + 'T12:00:00').getDay();
        return dow === 0 || dow === 6;
      });

      // Finanças & Dinheiros
      let fixedExp = 0, varExp = 0, savExp = 0;
      (state.expensesList || []).forEach(x => {
        const v = Number(x.amount || 0);
        if (x.category === 'fixa') fixedExp += v;
        else if (x.category === 'poupanca') savExp += v;
        else varExp += v;
      });
      const totalOutflows = +(fixedExp + varExp + savExp).toFixed(2);
      const freeCash = +(netSalary - totalOutflows).toFixed(2);
      const totalWorkedH = Math.max(1, totalNormalHours + totalPaidExtraHours);
      const netPerWorkedHour = +(netSalary / totalWorkedH).toFixed(2);

      return {
        list, congeRate, congeInfo,
        totalGross: +totalGross.toFixed(2),
        totalOtAndSupplements: +totalOtAndSupplements.toFixed(2),
        totalBonusEarned: +totalBonusEarned.toFixed(2),
        totalNormalHours: +totalNormalHours.toFixed(2),
        totalPaidExtraHours: +totalPaidExtraHours.toFixed(2),
        annualCongeUsed,
        annualCongeRemaining: Math.max(0, Number(state.annualCongeQuota) - annualCongeUsed),
        totalReposBankHours: +totalReposBankHours.toFixed(2),
        congeDaysCount, unworkedHolidayHours,
        unworkedHolidayPay: +unworkedHolidayPay.toFixed(2),
        deductionBreakdown,
        totalSocialDeductions: +totalSocialDeductions.toFixed(2),
        estimatedTax, vouchersCount, voucherDeduction, cis,
        totalExpensesReimb: +totalExpensesReimb.toFixed(2),
        netSalary, weekendHolidays, yearHolidays,
        fixedExp, varExp, savExp, totalOutflows, freeCash, netPerWorkedHour
      };
    }

    // ==================== RELÓGIO DE PONTO EM TEMPO REAL ====================
    let liveInterval = null;
    function updateLiveClockDisplay() {
      const el = document.getElementById('liveClockBox');
      if (!el || !state.liveClock.running) return;
      const elapsedSec = Math.max(0, Math.floor((Date.now() - state.liveClock.startTimeMs) / 1000));
      const hrs = Math.floor(elapsedSec / 3600);
      const mins = Math.floor((elapsedSec % 3600) / 60);
      const secs = elapsedSec % 60;
      const elapsedHoursDec = elapsedSec / 3600;

      const normalRate = Number(state.baseRate) + Number(state.hourlyBonus);
      const otRate = Number(state.baseRate) * (1 + Number(state.otSupplementPct) / 100) + (state.includeBonusInOt ? Number(state.hourlyBonus) : 0);

      let earned = 0;
      if (elapsedHoursDec <= state.standardDailyHours) {
        earned = elapsedHoursDec * normalRate;
      } else {
        earned = (state.standardDailyHours * normalRate) + ((elapsedHoursDec - state.standardDailyHours) * otRate);
      }

      el.innerHTML = `
        <div class="row">
          <div>
            <div style="font-size:22px; font-weight:900; font-family:monospace; color:#38bdf8;">
              ${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}
            </div>
            <div class="subtext">Turno em curso desde ${new Date(state.liveClock.startTimeMs).toTimeString().slice(0,5)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:22px; font-weight:900; color:#10b981;">+${earned.toFixed(3)} €</div>
            <div class="subtext">${normalRate.toFixed(2)} €/h acumulados</div>
          </div>
        </div>
      `;
    }

      if (!state.liveClock.running) {
        state.liveClock.running = true;
        state.liveClock.startTimeMs = Date.now();
        saveState();
      } else {
        const startDt = new Date(state.liveClock.startTimeMs);
        const endDt = new Date();
        const todayISO = fmtISO(startDt);
        const startStr = startDt.toTimeString().slice(0, 5);
        const endStr = endDt.toTimeString().slice(0, 5);
        const calc = calcShiftFromTimes(startStr, endStr, state.defaultBreakMin, state.standardDailyHours, todayISO);

        state.form.date = todayISO;
        state.form.type = 'work';
        state.form.start = startStr;
        state.form.end = endStr;
        state.form.breakMin = state.defaultBreakMin;
        state.form.normalH = calc.normalH;
        state.form.extraH = calc.extraH;
        state.form.nightH = calc.nightH;
        state.form.sundayH = calc.sundayH;

        state.liveClock.running = false;
        state.liveClock.startTimeMs = null;
        window.saveEntry();
      }

      } else if (tpl === 'feriado_trab') {
        state.form.type = 'feriado_trab'; state.form.normalH = state.standardDailyHours; state.form.extraH = 0;
      }
      if (state.form.type === 'work') {
        const calc = calcShiftFromTimes(state.form.start, state.form.end, state.form.breakMin, state.standardDailyHours, state.form.date);
        state.form.normalH = calc.normalH; state.form.extraH = calc.extraH; state.form.nightH = calc.nightH; state.form.sundayH = calc.sundayH;
      }
      saveState();
    };

    window.updateFormField = (field, val) => {
      state.form[field] = val;
      if (['start', 'end', 'breakMin', 'date'].includes(field) && state.form.type === 'work') {
        const calc = calcShiftFromTimes(state.form.start, state.form.end, state.form.breakMin, state.standardDailyHours, state.form.date);
        state.form.normalH = calc.normalH; state.form.extraH = calc.extraH; state.form.nightH = calc.nightH; state.form.sundayH = calc.sundayH;
      }
      saveState();
    };

    window.saveEntry = () => {
      const ym = state.form.date.slice(0, 7);
      state.selectedMonth = ym;
      if (!state.entries[ym]) state.entries[ym] = [];
      state.entries[ym] = state.entries[ym].filter(e => e.date !== state.form.date);
      state.entries[ym].push({ ...state.form });
      state.editingDate = null;
      saveState();
    };

    window.editEntryFromList = (dateStr) => {
      const ym = dateStr.slice(0, 7);
      const list = getEffectiveMonthEntries(ym);
      const found = list.find(e => e.date === dateStr);
      if (found) {
        state.form = { ...found };
        delete state.form.isAutoHoliday;
      } else {
        state.form.date = dateStr;
      }
      state.editingDate = dateStr;
      state.activeTab = 'registo';
      saveState();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteEntry = (date) => {
      const ym = state.selectedMonth;
      if (!state.entries[ym]) return;
      state.entries[ym] = state.entries[ym].filter(e => e.date !== date);
      if (state.editingDate === date) state.editingDate = null;
      saveState();
    };

    window.autoFillWorkweek = () => {
      const ym = state.selectedMonth;
      const [y, m] = ym.split('-').map(Number);
      const holidays = getPublicHolidays(y, state.country).map(h => h.date);
      if (!state.entries[ym]) state.entries[ym] = [];
      const daysInMonth = new Date(y, m, 0).getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${ym}-${String(d).padStart(2, '0')}`;
        const dow = new Date(dateStr + 'T12:00:00').getDay();
        const exists = state.entries[ym].some(e => e.date === dateStr);
        if (dow >= 1 && dow <= 5 && !holidays.includes(dateStr) && !exists) {
          state.entries[ym].push({
            date: dateStr, type: 'work', start: '07:00', end: '15:30',
            breakMin: state.defaultBreakMin, normalH: state.standardDailyHours,
            extraH: 0, nightH: 0, sundayH: 0, otMode: 'pay', expense: 0, note: 'Turno Normal'
          });
        }
      }
      saveState();
    };

    // ==================== FUNÇÕES DO GESTOR DE DINHEIROS ====================
    window.addExpenseItem = () => {

      state.expensesList.push({

        category: state.newExpense.category || 'fixa',
        amount: Number(state.newExpense.amount)

      state.newExpense = { name: "", category: "fixa", amount: "" };
      saveState();
    };

    window.deleteExpenseItem = (id) => {
      state.expensesList = state.expensesList.filter(x => x.id !== id);
      saveState();
    };

    window.applyIndex25 = () => {
      state.baseRate = +(Number(state.baseRate) * 1.025).toFixed(2);
      saveState();
    };

    window.generateBackupCode = () => {
      state.backupText = JSON.stringify(state);
      saveState();
    };

    window.restoreFromBackupCode = () => {
      try {

        Object.assign(state, parsed);
        state.backupText = "";
        saveState();
        alert("Dados restaurados com sucesso!");

    // ==================== ABA 2: CALENDÁRIO VISUAL & FERIADOS ====================
    function renderCalendarioTab(t, summary) {
      const [y, m] = state.selectedMonth.split('-').map(Number);
      const firstDay = new Date(y, m - 1, 1);
      let startOffset = firstDay.getDay() - 1; // Segunda = 0
      if (startOffset < 0) startOffset = 6;
      const daysInMonth = new Date(y, m, 0).getDate();
      const mapEntries = {};
      summary.list.forEach(e => { mapEntries[e.date] = e; });

      const cells = [];
      for (let i = 0; i < startOffset; i++) cells.push(`<div class="cal-day empty"></div>`);
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${state.selectedMonth}-${String(d).padStart(2, '0')}`;
        const entry = mapEntries[dateStr];
        let tagHtml = '';
        let borderStyle = '';
        if (entry) {
          if (entry.type === 'conge') {
            tagHtml = `<div class="cal-tag bg-amber">Congé</div>`;
            borderStyle = 'border-color: rgba(245,158,11,0.5);';
          } else if (entry.type.includes('feriado')) {
            tagHtml = `<div class="cal-tag bg-purple">Feriado</div>`;
            borderStyle = 'border-color: rgba(168,85,247,0.5);';
          } else if (entry.type === 'work') {
            tagHtml = `<div class="cal-tag bg-emerald">${entry.normalH}h${Number(entry.extraH)>0 ? '+'+entry.extraH : ''}</div>`;
            borderStyle = 'border-color: rgba(16,185,129,0.4);';
          } else {
            tagHtml = `<div class="cal-tag bg-sky">${entry.type}</div>`;
          }
        }
        cells.push(`
          <div onclick="editEntryFromList('${dateStr}')" class="cal-day" style="${borderStyle}">
            <div class="cal-num">${d}</div>
            ${tagHtml}
          </div>
        `);
      }

      const rateUnworkedHol = Number(state.baseRate) + (state.includeBonusInUnworkedHoliday ? Number(state.hourlyBonus) : 0);
      const dayPayUnworked = (state.standardDailyHours * rateUnworkedHol).toFixed(2);

      return `
        <!-- CONTADORES DE FÉRIAS E BANCO DE HORAS -->
        <div class="card">
          <div class="grid-3" style="text-align:center;">
            <div style="background:var(--card-alt); padding:10px; border-radius:12px;">
              <div class="subtext">Férias Restantes</div>
              <div style="font-size:18px; font-weight:900; color:#fcd34d;">${summary.annualCongeRemaining} / ${state.annualCongeQuota}d</div>
            </div>
            <div style="background:var(--card-alt); padding:10px; border-radius:12px;">
              <div class="subtext">Banco Horas (Repos)</div>
              <div style="font-size:18px; font-weight:900; color:#38bdf8;">${summary.totalReposBankHours}h</div>
            </div>
            <div style="background:var(--card-alt); padding:10px; border-radius:12px;">
              <div class="subtext">Feriados Fim Semana</div>
              <div style="font-size:18px; font-weight:900; color:#d8b4fe;">+${summary.weekendHolidays.length} dias</div>
            </div>
          </div>
        </div>

        <!-- GRELHA MENSAL INTERATIVA -->
        <div class="card">
          <div class="row" style="margin-bottom:6px;">
            <span style="font-size:14px; font-weight:800;">📅 Calendário de ${state.selectedMonth}</span>
            <span class="subtext">Toque num dia para editar</span>
          </div>
          <div class="cal-grid">
            <div class="cal-head">Seg</div><div class="cal-head">Ter</div><div class="cal-head">Qua</div>
            <div class="cal-head">Qui</div><div class="cal-head">Sex</div><div class="cal-head">Sáb</div><div class="cal-head">Dom</div>
            ${cells.join('')}
          </div>
        </div>

        <!-- LISTA DOS FERIADOS OFICIAIS DO ANO -->
        <div class="card">
          <div class="row" style="margin-bottom:10px;">
            <div>
              <div style="font-size:14px; font-weight:800;">🎉 Feriados Oficiais (${y})</div>
              <div class="subtext">Feriado não trabalhado (8h) = <b style="color:var(--success);">${dayPayUnworked} €</b></div>
            </div>
            <label style="display:flex; align-items:center; gap:6px; margin:0;">
              <input type="checkbox" style="width:18px; height:18px;" ${state.autoPayUnworkedHolidays?'checked':''} onchange="state.autoPayUnworkedHolidays=this.checked; saveState();" />
              <span>Auto-Pagar</span>
            </label>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${summary.yearHolidays.map(h => {
              const dow = new Date(h.date + 'T12:00:00').getDay();
              const isWknd = (dow === 0 || dow === 6);
              return `
                <div class="row" style="background:var(--card-alt); padding:9px 12px; border-radius:10px;">
                  <div>
                    <div style="font-weight:800; font-size:12px;">${h.date} — ${h.name}</div>
                    <div class="subtext">${isWknd ? 'Fim de semana: dá +1 dia de Congé Compensatório' : 'Dia útil: pago automaticamente na folha'}</div>
                  </div>
                  <span class="badge ${isWknd ? 'bg-amber' : 'bg-emerald'}">
                    ${isWknd ? '+1 Dia Comp.' : `+${dayPayUnworked} €`}
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

        <!-- LISTA DE DESPESAS E CUSTO EM HORAS DE TRABALHO -->
        <div class="card">
          <div style="font-size:13px; font-weight:800; margin-bottom:8px;">Suas Despesas & Equivalência em Horas de Trabalho</div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${(state.expensesList || []).map(item => {
              const hoursCost = (Number(item.amount) / Math.max(1, summary.netPerWorkedHour)).toFixed(1);
              const badgeColor = item.category === 'poupanca' ? 'bg-emerald' : item.category === 'fixa' ? 'bg-rose' : 'bg-amber';
              return `
                <div class="row" style="background:var(--card-alt); padding:10px 12px; border-radius:12px;">
                  <div>
                    <div style="font-weight:800; font-size:13px;">${item.name}</div>
                    <div class="subtext">Equivale a <b>${hoursCost} horas</b> do seu trabalho líquido</div>
                  </div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <span class="badge ${badgeColor}">${Number(item.amount).toFixed(2)} €</span>
                    <button onclick="deleteExpenseItem(${item.id})" class="btn-danger" style="padding:5px 8px; font-size:11px;">✕</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ==================== ABA 5: CONFIGURAÇÕES & BACKUP ====================
    function renderConfigTab(t, profile) {
      return `
        <div class="card">
          <div class="row" style="margin-bottom:10px;">
            <span style="font-size:14px; font-weight:800; color:#38bdf8;">⚙️ Salário, Prémio 2,60€ & Classe Fiscal</span>
            <button onclick="applyIndex25()" class="badge bg-amber" style="border:none; cursor:pointer; padding:6px 10px;">
              +2,5% Index
            </button>
          </div>

          <div class="grid-2" style="margin-bottom:8px;">
            <div>
              <label>País de Trabalho</label>
              <select onchange="setCountry(this.value)">
                ${Object.keys(state.countryProfiles).map(c => `<option value="${c}" ${state.country===c?'selected':''}>${state.countryProfiles[c].name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Classe de Imposto</label>
              <select onchange="setTaxClass(this.value)">
                ${profile.classes.map(c => `<option value="${c.id}" ${profile.selectedClass===c.id?'selected':''}>${c.label}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="grid-2" style="margin-bottom:8px;">
            <div>
              <label>Valor Hora Base (€/h)</label>
              <input type="number" step="0.01" value="${state.baseRate}" onchange="state.baseRate=Number(this.value); saveState();" />
            </div>
            <div>
              <label>Prémio Fixo (€/h)</label>
              <input type="number" step="0.01" value="${state.hourlyBonus}" onchange="state.hourlyBonus=Number(this.value); saveState();" />
            </div>
          </div>

          <div class="grid-3" style="margin-bottom:8px;">
            <div>
              <label>Retenção Imposto (%)</label>
              <input type="number" step="0.1" value="${profile.taxRate}" onchange="state.countryProfiles[state.country].taxRate=Number(this.value); saveState();" />
            </div>
            <div>
              <label>Congé Manual (€/h)</label>
              <input type="number" step="0.01" value="${state.manualCongeRate}" onchange="state.manualCongeRate=Number(this.value); saveState();" />
            </div>
            <div>
              <label>Meta Líquida (€)</label>
              <input type="number" step="50" value="${state.monthlyNetGoal}" onchange="state.monthlyNetGoal=Number(this.value); saveState();" />
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px; font-size:12px;">
            <label style="display:flex; align-items:center; gap:8px; color:var(--text);">
              <input type="checkbox" style="width:18px; height:18px;" ${state.includeBonusInOt?'checked':''} onchange="state.includeBonusInOt=this.checked; saveState();" />
              Incluir prémio (${state.hourlyBonus.toFixed(2)} €/h) nas Horas Extras (+${state.otSupplementPct}%)
            </label>
            <label style="display:flex; align-items:center; gap:8px; color:var(--text);">
              <input type="checkbox" style="width:18px; height:18px;" ${state.includeBonusInUnworkedHoliday?'checked':''} onchange="state.includeBonusInUnworkedHoliday=this.checked; saveState();" />
              Incluir prémio (${state.hourlyBonus.toFixed(2)} €/h) nos Feriados Não Trabalhados
            </label>
          </div>
        </div>

        <!-- DESCONTOS INDIVIDUAIS DO PAÍS -->
        <div class="card">
          <div style="font-size:14px; font-weight:800; color:#6ee7b7; margin-bottom:10px;">
            🏛️ Descontos Sociais (${profile.name})
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${profile.deductions.map((d, idx) => `
              <div class="row" style="background:var(--card-alt); padding:8px 12px; border-radius:10px;">
                <span style="font-size:12px; font-weight:600;">${d.label}</span>
                <div style="display:flex; align-items:center; gap:4px; width:90px;">
                  <input type="number" step="0.05" value="${d.rate}" onchange="state.countryProfiles[state.country].deductions[${idx}].rate=Number(this.value); saveState();" style="text-align:right; padding:6px;" />
                  <span class="subtext">%</span>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="grid-2" style="margin-top:10px;">
            <div>
              <label>Chèque-Repas (€/dia trab.)</label>
              <input type="number" step="0.1" value="${profile.mealVoucherCost}" onchange="state.countryProfiles[state.country].mealVoucherCost=Number(this.value); saveState();" />
            </div>
            <div>
              <label>Crédito Fiscal CIS (€/mês)</label>
              <input type="number" step="1" value="${profile.cisCredit}" onchange="state.countryProfiles[state.country].cisCredit=Number(this.value); saveState();" />
            </div>
          </div>
        </div>

        <!-- CÓPIA DE SEGURANÇA POR TEXTO (FUNCIONA DENTRO DO APK) -->
        <div class="card">
          <div style="font-size:14px; font-weight:800; margin-bottom:6px;">💾 Backup Seguro (Copiar / Restaurar Dados)</div>
          <div class="subtext" style="margin-bottom:8px;">Gere o código abaixo para guardar todos os seus meses num bloco de notas antes de desinstalar ou atualizar o APK.</div>
          <div class="grid-2" style="margin-bottom:8px;">
            <button onclick="generateBackupCode()" class="btn-ghost">1. Gerar Código Backup</button>
            <button onclick="restoreFromBackupCode()" class="btn-success">2. Restaurar Código</button>
          </div>
          <textarea rows="3" placeholder="Cole aqui o código de backup ou clique em Gerar Código..." onchange="state.backupText=this.value">${state.backupText || ''}</textarea>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
