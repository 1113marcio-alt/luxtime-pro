<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob: gap:; style-src * 'self' 'unsafe-inline'; script-src * 'self' 'unsafe-inline' 'unsafe-eval';" />
  <title>Rastreador de Horas - LuxTime Pro</title>
  <style>
    :root {
      --bg-main: #131722;
      --bg-cal: #0e1118;
      --blue-pill: #1e4d78;
      --blue-pill-light: #255d91;
      --drawer-header: #a8c7fa;
      --drawer-bg: #12151e;
      --gold-bg: #2d2518;
      --gold-text: #f5a623;
      --coral: #cf7973;
      --text: #f1f5f9;
      --muted: #8e9bb0;
      --accent: #38bdf8;
      --purple-dot: #c026d3;
      --emerald: #10b981;
      --rose: #f43f5e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }
    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 16px 28px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* TOP BAR IGUAL À FOTO 1 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      margin-bottom: 18px;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .multi-select-pill {
      background: #1a2436;
      color: #a8c5e2;
      border: 1px solid rgba(168, 199, 250, 0.14);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .multi-select-pill.active {
      background: var(--blue-pill);
      color: #fff;
      border-color: #60a5fa;
      box-shadow: 0 0 14px rgba(30, 77, 120, 0.7);
    }

    /* SELETOR DE MÊS IGUAL À FOTO 1 */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 0 4px;
    }
    .circle-nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #232938;
      border: none;
      color: #cbd5e1;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .circle-nav-btn:active { transform: scale(0.93); }
    .month-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #ffffff;
    }

    /* BOTÃO COMEÇAR A TRABALHAR IGUAL À FOTO 1 */
    .start-work-btn {
      width: 100%;
      background: var(--blue-pill);
      color: #ffffff;
      border: none;
      border-radius: 26px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: background 0.15s, transform 0.1s;
    }
    .start-work-btn:active { transform: scale(0.98); }
    .play-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ffffff;
      color: var(--blue-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      padding-left: 2px;
    }

    /* CARTÃO DO CALENDÁRIO IGUAL À FOTO 1 */
    .calendar-box {
      background: var(--bg-cal);
      border-radius: 26px;
      padding: 18px 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      margin-bottom: 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .weekdays-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 12px;
    }
    .wk-label {
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #94a3b8;
    }
    .wk-label.weekend { color: var(--coral); }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 10px;
      column-gap: 6px;
    }
    .day-cell {
      height: 62px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
      position: relative;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.12s;
    }
    .day-cell.empty { cursor: default; pointer-events: none; }
    .day-cell.weekend-cell {
      background: repeating-linear-gradient(
        -45deg,
        #161922,
        #161922 5px,
        #1a1e29 5px,
        #1a1e29 10px
      );
    }
    .day-cell.selected-day {
      background: #1a2a3e;
      border-color: #6b8fb3;
    }
    .day-cell.multi-picked {
      background: rgba(56, 189, 248, 0.24);
      border-color: #38bdf8;
    }
    .day-num {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      z-index: 2;
    }
    .weekend-cell .day-num { color: #788296; }
    .selected-day .day-num { color: #ffffff; font-weight: 800; }

    .holiday-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d946ef;
      box-shadow: 0 0 6px #d946ef;
    }
    .couch-icon {
      margin-top: 6px;
      opacity: 0.22;
      color: #94a3b8;
    }
    .day-pill-tag {
      margin-top: 5px;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 6px;
      z-index: 2;
      white-space: nowrap;
    }
    .tag-work { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .tag-ot { background: rgba(56, 189, 248, 0.22); color: #7dd3fc; }
    .tag-conge { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }
    .tag-hol { background: rgba(192, 38, 211, 0.22); color: #f0abfc; }

    /* CARTÃO INFERIOR AZUL IGUAL À FOTO 1 */
    .bottom-summary-pill {
      background: var(--blue-pill);
      border-radius: 26px;
      padding: 18px 16px;
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
    .summary-col {
      text-align: center;
      padding: 0 6px;
    }
    .summary-divider {
      height: 38px;
      background: rgba(255, 255, 255, 0.2);
    }
    .summary-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.9px;
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .summary-value {
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
    }
    .summary-sub {
      font-size: 10px;
      color: #bae6fd;
      margin-top: 3px;
      font-weight: 600;
    }

    /* MENU LATERAL DESLIZANTE IGUAL À FOTO 2 */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer-panel {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 82%;
      max-width: 330px;
      background: var(--drawer-bg);
      z-index: 1001;
      transform: translateX(-102%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 30px rgba(0,0,0,0.6);
    }
    .drawer-panel.open { transform: translateX(0); }

    .drawer-top {
      background: var(--drawer-header);
      padding: 34px 22px 22px;
      color: #0f172a;
    }
    .app-logo-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #0d1624;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .drawer-title {
      font-size: 19px;
      font-weight: 800;
      color: #0d1b2a;
      margin-bottom: 14px;
    }
    .google-sync-btn {
      background: #12161f;
      color: #f8fafc;
      border: none;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      width: 100%;
      justify-content: center;
    }

    .drawer-menu {
      padding: 12px 12px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .drawer-item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .drawer-item:active { background: rgba(255,255,255,0.06); }
    .drawer-item.active-view { background: rgba(56, 189, 248, 0.14); color: #38bdf8; }
    .drawer-item.premio-item {
      background: var(--gold-bg);
      color: var(--gold-text);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .drawer-divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 8px 4px;
    }
    .drawer-footer {
      padding: 14px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }

    /* CARTÕES E MODAIS INTERNOS */
    .section-card {
      background: #181e2c;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      background: #0f141f;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-blue { background: var(--blue-pill); color: #fff; width: 100%; }
    .btn-emerald { background: var(--emerald); color: #042f2e; width: 100%; font-weight: 800; }
    .btn-rose { background: rgba(244,63,94,0.18); color: #fda4af; border: 1px solid rgba(244,63,94,0.3); }
    .btn-dark { background: #232a3b; color: #e2e8f0; }

    /* MODAL BOTTOM SHEET PARA EDITAR O DIA */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 950;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: #171c28;
      border-radius: 26px 26px 0 0;
      padding: 20px 18px 30px;
      border-top: 1px solid rgba(255,255,255,0.12);
      max-height: 90vh;
      overflow-y: auto;
    }
    .tag-chip {
      padding: 6px 11px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      background: #0f141f;
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
      cursor: pointer;
    }
    .tag-chip.active { background: var(--blue-pill); color: #fff; border-color: #60a5fa; }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="drawerContainer"></div>
  <div id="modalContainer"></div>

  <script>
    // ==================== NOMES DOS MESES E TRADUÇÕES (6 ID
