    // ==================== CÁLCULO DE FERIADOS POR ANO ====================
    function getEasterDate(year) {
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

    function addDays(date, days) {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    }

    function fmtISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getPublicHolidays(year, country) {
      const easter = getEasterDate(year);
      const easterMonday = fmtISO(addDays(easter, 1));
      const ascension = fmtISO(addDays(easter, 39));
      const whitMonday = fmtISO(addDays(easter, 50));
      const goodFriday = fmtISO(addDays(easter, -2));
      const corpusChristi = fmtISO(addDays(easter, 60));

      if (country === 'LU') {
        return [
          { date: `${year}-01-01`, name: "Nouvel An / Ano Novo" },
          { date: easterMonday, name: "Lundi de Pâques / Segunda de Páscoa" },
          { date: `${year}-05-01`, name: "Premier Mai / Dia do Trabalhador" },
          { date: `${year}-05-09`, name: "Journée de l'Europe / Dia da Europa" },
          { date: ascension, name: "Ascension / Ascensão" },
          { date: whitMonday, name: "Lundi de Pentecôte / Segunda de Pentecostes" },
          { date: `${year}-06-23`, name: "Fête Nationale (23 Juin)" },
          { date: `${year}-08-15`, name: "Assomption / Assunção" },
          { date: `${year}-11-01`, name: "Toussaint / Todos os Santos" },
          { date: `${year}-12-25`, name: "Noël / Natal" },
          { date: `${year}-12-26`, name: "Saint-Étienne / 2.º Dia de Natal" }
        ];

        ];
      }

        breakMin: 30,
        normalH: 8,
        extraH: 1,
        nightH: 0,
        sundayH: 0,
        otMode: "pay",
        expense: 0,
        note: ""
      },
      audit: {
        companyHours: 168,
        companyCongeRate: 21.80,
        companyNet: 3250
      }
    };

    function saveState() {
      localStorage.setItem('luxtime_v3_state', JSON.stringify(state));
      render();
    }

    function calcShiftFromTimes(startStr, endStr, breakMin, stdHours) {
      if (!startStr || !endStr) return { normalH: stdHours, extraH: 0, nightH: 0 };
      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      let startMin = sh * 60 + sm;
      let endMin = eh * 60 + em;
      if (endMin <= startMin) endMin += 24 * 60;

      const totalWorkedMin = Math.max(0, (endMin - startMin) - Number(breakMin || 0));
      const totalH = +(totalWorkedMin / 60).toFixed(2);
      const normalH = Math.min(stdHours, totalH);
      const extraH = +(Math.max(0, totalH - stdHours)).toFixed(2);

      let nightMin = 0;
      for (let m = startMin; m < endMin; m++) {
        const clockMin = m % (24 * 60);
        if (clockMin >= 22 * 60 || clockMin < 6 * 60) nightMin++;
      }
      const nightH = +(nightMin / 60).toFixed(2);
      return { normalH, extraH, nightH };
    }

    function getPrevious3Months(ym) {
      const [y, m] = ym.split('-').map(Number);
      const res = [];
      for (let i = 1; i <= 3; i++) {
        const d = new Date(y, m - 1 - i, 1);
        res.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      }
      return res;
    }

    function computeRowGross(entry, congeRateForMonth) {
      const base = Number(state.baseRate);
      const bonus = Number(state.hourlyBonus);
      const rateWithBonus = base + bonus;
      const otBaseRate = base * (1 + Number(state.otSupplementPct) / 100) + (state.includeBonusInOt ? bonus : 0);

      if (entry.type === 'baixa' || entry.type === 'recupera') {
        return { gross: 0, otGross: 0, bonusTotal: 0, hoursCounted: 0 };
      }
      if (entry.type === 'conge') {
        const h = Number(entry.normalH || state.standardDailyHours);
        return { gross: h * congeRateForMonth, otGross: 0, bonusTotal: 0, hoursCounted: h };
      }
      if (entry.type === 'feriado_chome') {
        const h = Number(entry.normalH || state.standardDailyHours);
        const r = base + (state.includeBonusInUnworkedHoliday ? bonus : 0);
        return { gross: h * r, otGross: 0, bonusTotal: state.includeBonusInUnworkedHoliday ? h * bonus : 0, hoursCounted: h };
      }
      if (entry.type === 'feriado_trab') {
        const h = Number(entry.normalH || state.standardDailyHours);
        const holChome = h * (base + (state.includeBonusInUnworkedHoliday ? bonus : 0));
        const worked = h * rateWithBonus;
        const maj100 = h * base * (Number(state.holidaySupplementPct) / 100);
        return {
          gross: holChome + worked + maj100,
          otGross: maj100,
          bonusTotal: h * bonus * (state.includeBonusInUnworkedHoliday ? 2 : 1),
          hoursCounted: h
        };
      }

      const nh = Number(entry.normalH || 0);
      const eh = entry.otMode === 'pay' ? Number(entry.extraH || 0) : 0;
      const nightH = Number(entry.nightH || 0);

      const normalPay = nh * rateWithBonus;
      const otPay = eh * otBaseRate;
      const nightPay = nightH * base * (Number(state.nightSupplementPct) / 100);
      const bonusTotal = (nh * bonus) + (state.includeBonusInOt ? eh * bonus : 0);

      return {
        gross: normalPay + otPay + nightPay,
        otGross: otPay + nightPay,
        bonusTotal,
        hoursCounted: nh + eh
      };
    }

    function getCongeRate(ym) {
      const prev3 = getPrevious3Months(ym);
      let totalGross = 0;
      let totalHours = 0;
      prev3.forEach(m => {
        const list = state.entries[m] || [];
        list.forEach(e => {
          const r = computeRowGross(e, Number(state.manualCongeRate));
          totalGross += r.gross;
          totalHours += r.hoursCounted;
        });
      });
      if (totalHours >= 40) return +(totalGross / totalHours).toFixed(2);
      return Number(state.manualCongeRate);
    }

    function getEffectiveMonthEntries(ym) {
      const manual = [...(state.entries[ym] || [])];
      const [year] = ym.split('-').map(Number);
      const holidays = getPublicHolidays(year, state.country).filter(h => h.date.startsWith(ym));

      if (state.autoPayUnworkedHolidays) {
        holidays.forEach(h => {
          const d = new Date(h.date + 'T12:00:00');
          const dow = d.getDay();
          const alreadyLogged = manual.some(e => e.date === h.date);
          if (!alreadyLogged && dow >= 1 && dow <= 5) {
            manual.push({
              date: h.date,
              type: 'feriado_chome',
              start: '-',
              end: '-',
              breakMin: 0,
              normalH: state.standardDailyHours,
              extraH: 0,
              nightH: 0,
              otMode: 'pay',
              expense: 0,
              note: `Feriado Oficial: ${h.name}`,
              isAutoHoliday: true
            });
          }
        });
      }
      return manual.sort((a, b) => a.date.localeCompare(b.date));
    }

    function calculateMonthSummary(ym) {
      const profile = state.countryProfiles[state.country];
      const congeRate = getCongeRate(ym);
      const list = getEffectiveMonthEntries(ym);

      let totalGross = 0, totalOtAndSupplements = 0, totalBonusEarned = 0;
      let totalNormalHours = 0, totalPaidExtraHours = 0, totalBankHours = 0;
      let workedDaysForVouchers = 0, congeDaysCount = 0, unworkedHolidayHours = 0, unworkedHolidayPay = 0, totalExpenses = 0;

      list.forEach(e => {
        const r = computeRowGross(e, congeRate);
        totalGross += r.gross;
        totalOtAndSupplements += r.otGross;
        totalBonusEarned += r.bonusTotal;
        totalExpenses += Number(e.expense || 0);

        if (e.type === 'work' || e.type === 'feriado_trab') {
          totalNormalHours += Number(e.normalH || 0);
          workedDaysForVouchers++;
          if (e.otMode === 'pay') totalPaidExtraHours += Number(e.extraH || 0);
          else totalBankHours += Number(e.extraH || 0);
        } else if (e.type === 'conge') {
          congeDaysCount++;
        } else if (e.type === 'feriado_chome') {
          unworkedHolidayHours += Number(e.normalH || state.standardDailyHours);
          unworkedHolidayPay += r.gross;
        }
      });

      const regularGross = Math.max(0, totalGross - totalOtAndSupplements);
      const deductionBreakdown = [];
      let totalSocialDeductions = 0;

      profile.deductions.forEach(d => {
        let base = d.onOt ? totalGross : regularGross;
        if (d.allowance) base = Math.max(0, totalGross - Number(d.allowance));
        const val = +(base * (Number(d.rate) / 100)).toFixed(2);
        totalSocialDeductions += val;
        deductionBreakdown.push({ label: d.label, rate: d.rate, amount: val });
      });

      const taxableGross = profile.otTaxExempt
        ? Math.max(0, regularGross - totalSocialDeductions)
        : Math.max(0, totalGross - totalSocialDeductions);

      const estimatedTax = +(taxableGross * (Number(profile.taxRate) / 100)).toFixed(2);
      const vouchersCount = Math.min(Number(profile.mealVoucherMax || 0), workedDaysForVouchers);
      const voucherDeduction = +(vouchersCount * Number(profile.mealVoucherCost || 0)).toFixed(2);
      const cis = Number(profile.cisCredit || 0);

      const netSalary = +(totalGross - totalSocialDeductions - estimatedTax - voucherDeduction + cis + totalExpenses).toFixed(2);

      const [year] = ym.split('-').map(Number);
      const yearHolidays = getPublicHolidays(year, state.country);
      const weekendHolidays = yearHolidays.filter(h => {
        const dow = new Date(h.date + 'T12:00:00').getDay();
        return dow === 0 || dow === 6;
      });

      return {
        list, congeRate,
        totalGross: +totalGross.toFixed(2),
        totalOtAndSupplements: +totalOtAndSupplements.toFixed(2),
        totalBonusEarned: +totalBonusEarned.toFixed(2),
        totalNormalHours: +totalNormalHours.toFixed(2),
        totalPaidExtraHours: +totalPaidExtraHours.toFixed(2),
        totalBankHours: +totalBankHours.toFixed(2),
        congeDaysCount, unworkedHolidayHours,
        unworkedHolidayPay: +unworkedHolidayPay.toFixed(2),
        deductionBreakdown,
        totalSocialDeductions: +totalSocialDeductions.toFixed(2),
        estimatedTax, vouchersCount, voucherDeduction, cis,
        totalExpenses: +totalExpenses.toFixed(2),
        netSalary, weekendHolidays, yearHolidays
      };
    }

    window.setTab = (t) => { state.activeTab = t; saveState(); };

      } else if (tpl === 'feriado_trab') {

      if (state.form.type === 'work') {

        state.form.normalH = calc.normalH; state.form.extraH = calc.extraH; state.form.nightH = calc.nightH;

      if (['start', 'end', 'breakMin'].includes(field) && state.form.type === 'work') {

    function renderCalendarioTab(t, summary) {
      const [year] = state.selectedMonth.split('-').map(Number);
      const rateUnworkedHol = Number(state.baseRate) + (state.includeBonusInUnworkedHoliday ? Number(state.hourlyBonus) : 0);
      const dayPayUnworked = (state.standardDailyHours * rateUnworkedHol).toFixed(2);
      const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

      return `
        <div class="glass p-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
            <div>
              <h2 class="text-base font-extrabold text-white">${t.holidayLegend} (${year})</h2>
              <p class="text-xs text-slate-400">Valor Feriado Não Trabalhado (8h): <b class="text-emerald-400">${dayPayUnworked} €</b></p>
            </div>
            <label class="flex items-center gap-2 text-xs bg-slate-800 px-3 py-2 rounded-xl">
              <input type="checkbox" ${state.autoPayUnworkedHolidays ? 'checked' : ''} onchange="state.autoPayUnworkedHolidays = this.checked; saveState();" />
              <span>${t.unworkedHolidayAuto}</span>
            </label>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
            ${summary.yearHolidays.map(h => {
              const dow = new Date(h.date + 'T12:00:00').getDay();
              const isWeekend = (dow === 0 || dow === 6);
              return `
                <div class="p-3 rounded-xl border ${isWeekend ? 'bg-amber-500/10 border-amber-500/30' : 'bg-purple-500/10 border-purple-500/30'}">
                  <div class="flex items-center justify-between text-xs font-bold">
                    <span class="${isWeekend ? 'text-amber-300' : 'text-purple-300'}">${h.date} (${dayNames[dow]})</span>
                    <span class="${isWeekend ? 'text-amber-200' : 'text-emerald-300'}">${isWeekend ? '+1 Congé Comp.' : `+${dayPayUnworked} €`}</span>
                  </div>
                  <p class="text-sm font-bold text-white mt-1">${h.name}</p>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderFolhaTab(t, profile, summary) {
      return `
        <div class="glass p-4 max-w-2xl mx-auto space-y-2 text-xs">
          <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-2">
            <div>
              <h2 class="text-base font-extrabold text-white">Fiche de Salaire (${state.selectedMonth})</h2>
              <p class="text-slate-400">${profile.name} • ${t.taxClass} ${profile.selectedClass}</p>
            </div>
            <select onchange="setTaxClass(this.value)" class="text-xs font-bold">
              ${profile.classes.map(c => `<option value="${c.id}" ${profile.selectedClass === c.id ? 'selected' : ''}>${c.label}</option>`).join('')}
            </select>
          </div>
          <div class="flex justify-between py-1">
            <span>Horas Normais (${summary.totalNormalHours}h) + Prémio 2,60€/h</span>
            <span class="font-bold">${(summary.totalNormalHours * (Number(state.baseRate) + Number(state.hourlyBonus))).toFixed(2)} €</span>
          </div>
          <div class="flex justify-between py-1 text-purple-300">
            <span>Feriados Não Trabalhados (${summary.unworkedHolidayHours}h)</span>
            <span class="font-bold">+${summary.unworkedHolidayPay.toFixed(2)} €</span>
          </div>
          <div class="flex justify-between py-1 text-amber-300">
            <span>Férias / Congé (${summary.congeDaysCount}d @ ${summary.congeRate.toFixed(2)} €/h)</span>
            <span class="font-bold">+${(summary.congeDaysCount * state.standardDailyHours * summary.congeRate).toFixed(2)} €</span>
          </div>
          <div class="flex justify-between py-1 text-emerald-300">
            <span>Horas Extras (${summary.totalPaidExtraHours}h) & Suplementos</span>
            <span class="font-bold">+${summary.totalOtAndSupplements.toFixed(2)} €</span>
          </div>
          <div class="flex justify-between py-2 bg-slate-800 px-3 rounded-lg font-extrabold text-sm">
            <span>TOTAL BRUTO</span>
            <span class="text-sky-300">${summary.totalGross.toFixed(2)} €</span>
          </div>
          ${summary.deductionBreakdown.map(d => `
            <div class="flex justify-between py-1 text-rose-300">
              <span>- ${d.label} (${d.rate}%)</span>
              <span>-${d.amount.toFixed(2)} €</span>
            </div>
          `).join('')}
          <div class="flex justify-between py-1 text-rose-300">
            <span>- Imposto (${t.taxClass} ${profile.selectedClass}: ${profile.taxRate}%)</span>
            <span>-${summary.estimatedTax.toFixed(2)} €</span>
          </div>
          ${summary.voucherDeduction > 0 ? `
            <div class="flex justify-between py-1 text-amber-300">
              <span>- Chèques-Repas (${summary.vouchersCount}d × ${profile.mealVoucherCost.toFixed(2)} €)</span>
              <span>-${summary.voucherDeduction.toFixed(2)} €</span>
            </div>
          ` : ''}
          ${summary.cis > 0 ? `
            <div class="flex justify-between py-1 text-emerald-300">
              <span>+ Crédito Fiscal CIS</span>
              <span>+${summary.cis.toFixed(2)} €</span>
            </div>
          ` : ''}
          <div class="flex justify-between py-3 bg-emerald-500/20 border border-emerald-500/40 px-3 rounded-xl font-extrabold text-base mt-2">
            <span>SALÁRIO LÍQUIDO</span>
            <span class="text-emerald-300">${summary.netSalary.toFixed(2)} €</span>
          </div>
        </div>
      `;
    }

    function renderAuditoriaTab(t, summary) {
      const diffConge = +(state.audit.companyCongeRate - summary.congeRate).toFixed(2);
      const diffNet = +(state.audit.companyNet - summary.netSalary).toFixed(2);
      return `
        <div class="glass p-4 max-w-xl mx-auto space-y-3 text-xs">
          <h2 class="text-base font-extrabold text-white">Auditoria da Folha da Empresa</h2>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Taxa Congé Folha (€/h)</label>
              <input type="number" step="0.01" value="${state.audit.companyCongeRate}" onchange="state.audit.companyCongeRate = Number(this.value); saveState();" class="w-full" />
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Horas na Folha</label>
              <input type="number" step="0.5" value="${state.audit.companyHours}" onchange="state.audit.companyHours = Number(this.value); saveState();" class="w-full" />
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Líquido Recebido (€)</label>
              <input type="number" step="1" value="${state.audit.companyNet}" onchange="state.audit.companyNet = Number(this.value); saveState();" class="w-full" />
            </div>
          </div>
          <div class="p-3 rounded-xl bg-slate-800 space-y-1">
            <p>• Média Congé 3M: App <b>${summary.congeRate.toFixed(2)} €/h</b> vs Folha <b>${state.audit.companyCongeRate.toFixed(2)} €/h</b> (${diffConge >= 0 ? '+' : ''}${diffConge} €/h)</p>
            <p>• Salário Líquido: App <b>${summary.netSalary.toFixed(2)} €</b> vs Banco <b>${state.audit.companyNet.toFixed(2)} €</b> (${diffNet >= 0 ? '+' : ''}${diffNet} €)</p>
          </div>
        </div>
      `;
    }

    function renderConfigTab(t, profile) {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 text-xs">
          <div class="glass p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="font-extrabold text-sky-300 uppercase">Salário, Prémio 2,60€ & Classe</h2>
              <button onclick="applyIndex25()" class="px-2 py-1 rounded bg-amber-500/20 text-amber-300 font-bold">${t.applyIndex}</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-400 mb-1">${t.baseRate}</label>
                <input type="number" step="0.01" value="${state.baseRate}" onchange="state.baseRate = Number(this.value); saveState();" class="w-full font-bold" />
              </div>
              <div>
                <label class="block text-slate-400 mb-1">${t.hourlyBonus}</label>
                <input type="number" step="0.01" value="${state.hourlyBonus}" onchange="state.hourlyBonus = Number(this.value); saveState();" class="w-full font-bold text-emerald-400" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-amber-300 font-bold mb-1">${t.taxClass}</label>
                <select onchange="setTaxClass(this.value)" class="w-full font-bold">
                  ${profile.classes.map(c => `<option value="${c.id}" ${profile.selectedClass === c.id ? 'selected' : ''}>${c.label}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-slate-400 mb-1">Imposto (%)</label>
                <input type="number" step="0.1" value="${profile.taxRate}" onchange="state.countryProfiles[state.country].taxRate = Number(this.value); saveState();" class="w-full font-bold" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-slate-400 mb-1">Média Congé Manual (€/h)</label>
                <input type="number" step="0.01" value="${state.manualCongeRate}" onchange="state.manualCongeRate = Number(this.value); saveState();" class="w-full" />
              </div>
              <div>
                <label class="block text-slate-400 mb-1">${t.goalLabel}</label>
                <input type="number" step="50" value="${state.monthlyNetGoal}" onchange="state.monthlyNetGoal = Number(this.value); saveState();" class="w-full" />
              </div>
            </div>
          </div>

          <div class="glass p-4 space-y-2.5">
            <h2 class="font-extrabold text-emerald-300 uppercase">${t.deductionsTitle} (${profile.name})</h2>
            ${profile.deductions.map((d, idx) => `
              <div class="flex items-center justify-between bg-slate-800/70 p-2 rounded-lg">
                <span>${d.label}</span>
                <div class="flex items-center gap-1">
                  <input type="number" step="0.05" value="${d.rate}" onchange="state.countryProfiles[state.country].deductions[${idx}].rate = Number(this.value); saveState();" class="w-16 text-right font-bold" />
                  <span>%</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
