    :root {

      --card-alt: #192438;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #f43f5e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 92px;
      overflow-x: hidden;
      user-select: none;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.32);
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 700;
    }
    .bg-sky { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
    .bg-emerald { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .bg-amber { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .bg-purple { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; }
    .bg-rose { background: rgba(244, 63, 94, 0.15); color: #fda4af; }

    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input, select, textarea {
      width: 100%; background: var(--card-alt); color: var(--text);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 11px;
      padding: 9px 11px; font-size: 13px; font-weight: 600; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    button {
      border: none; border-radius: 12px; padding: 10px 13px;
      font-size: 12px; font-weight: 700; cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    .btn-primary { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #082f49; width: 100%; font-weight: 800; font-size: 13px; }
    .btn-success { background: linear-gradient(135deg, #34d399, #059669); color: #022c22; font-weight: 800; }
    .btn-warning { background: linear-gradient(135deg, #fbbf24, #d97706); color: #451a03; font-weight: 800; }
    .btn-danger { background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.35); }
    .btn-ghost { background: var(--card-alt); color: var(--text); border: 1px solid var(--border); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11, 17, 30, 0.96);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 6px 10px;
      z-index: 999;
    }
    .nav-item {
      background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px; border-radius: 12px; font-size: 10px; font-weight: 700;
    }
    .nav-item.active { color: var(--primary); background: rgba(56, 189, 248, 0.13); }
    .nav-icon { font-size: 18px; line-height: 1; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 8px; }
    .cal-head { text-align: center; font-size: 10px; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .cal-day {
      background: var(--card-alt); border: 1px solid var(--border);
      border-radius: 10px; min-height: 54px; padding: 4px;
      display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer;
    }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-num { font-size: 11px; font-weight: 800; }
    .cal-tag { font-size: 9px; font-weight: 700; padding: 2px 3px; border-radius: 5px; text-align: center; white-space: nowrap; overflow: hidden; }

    .stamp-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
    .stamp-btn {
      padding: 7px 10px; border-radius: 10px; font-size: 11px; font-weight: 800;
      white-space: nowrap; background: var(--card-alt); color: var(--muted); border: 1px solid var(--border);
    }
    .stamp-btn.active { border-color: var(--primary); color: #fff; background: rgba(56, 189, 248, 0.22); }

    .tag-chip {
      padding: 5px 9px; border-radius: 99px; font-size: 11px; font-weight: 700;
      background: var(--card-alt); color: var(--muted); border: 1px solid var(--border); white-space: nowrap;
    }
    .tag-chip.active { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border-color: var(--primary); }

    .progress-bar { width: 100%; height: 8px; background: #090d16; border-radius: 99px; overflow: hidden; margin-top: 6px; display: flex; }
    .progress-fill { height: 100%; }
    .kpi-val { font-size: 19px; font-weight: 900; margin-top: 2px; }
    .subtext { font-size: 11px; color: var(--muted); }
  </style>
</head>

    function getEasterDate(year) {
      var a = year % 19, b = Math.floor(year / 100), c = year % 100;
      var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      var m = Math.floor((a + 11 * h + 22 * l) / 451);
      var month = Math.floor((h + l - 7 * m + 114) / 31);
      var day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }
    function addDays(date, days) { var d = new Date(date); d.setDate(d.getDate() + days); return d; }
    function fmtISO(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getPublicHolidays(year, country) {

      var easterMon = fmtISO(addDays(easter, 1));

      var whitMon = fmtISO(addDays(easter, 50));
      var goodFri = fmtISO(addDays(easter, -2));
      var corpus = fmtISO(addDays(easter, 60));

        ];
      }

      audit: { companyHours: 168, companyCongeRate: 21.80, companyNet: 3250 },
      backupText: ""
    };

    var loaded = null;
    try { loaded = JSON.parse(localStorage.getItem('luxtime_v5_pro') || 'null'); } catch (e) { loaded = null; }
    var state = Object.assign({}, defaultState, loaded || {});
    if (!state.countryProfiles || !state.countryProfiles[state.country]) state.countryProfiles = DEFAULT_COUNTRY_PROFILES;
    if (!state.expensesList) state.expensesList = defaultState.expensesList;
    if (!state.liveClock) state.liveClock = { running: false, paused: false, startTimeMs: null, pauseStartMs: null, accumulatedPauseMs: 0 };

    function saveState() {
      try { localStorage.setItem('luxtime_v5_pro', JSON.stringify(state)); } catch (e) {}
      render();
    }

    function applyRoundingMinutes(totalMin, roundStep) {
      var step = Number(roundStep || 0);
      return step <= 0 ? totalMin : Math.round(totalMin / step) * step;
    }

    function calcShiftFromTimes(startStr, endStr, breakMin, stdHours, dateStr) {
      if (!startStr || !endStr) return { normalH: stdHours, extraH: 0, nightH: 0, sundayH: 0 };
      var sParts = startStr.split(':').map(Number);
      var eParts = endStr.split(':').map(Number);
      var startMin = sParts[0] * 60 + sParts[1];
      var endMin = eParts[0] * 60 + eParts[1];
      if (endMin <= startMin) endMin += 24 * 60;

      var rawWorkedMin = Math.max(0, (endMin - startMin) - Number(breakMin || 0));
      var totalWorkedMin = applyRoundingMinutes(rawWorkedMin, state.roundingMinutes);
      var totalH = +(totalWorkedMin / 60).toFixed(2);
      var normalH = Math.min(stdHours, totalH);
      var extraH = +(Math.max(0, totalH - stdHours)).toFixed(2);

      var nightMin = 0;
      for (var m = startMin; m < endMin; m++) {
        var clockMin = m % (24 * 60);
        if (clockMin >= 22 * 60 || clockMin < 6 * 60) nightMin++;
      }
      var nightH = +(nightMin / 60).toFixed(2);
      var isSun = dateStr ? (new Date(dateStr + 'T12:00:00').getDay() === 0) : false;
      return { normalH: normalH, extraH: extraH, nightH: nightH, sundayH: isSun ? totalH : 0 };
    }

    function getPrevious3Months(ym) {
      var parts = ym.split('-').map(Number);
      var res = [];
      for (var i = 1; i <= 3; i++) {
        var d = new Date(parts[0], parts[1] - 1 - i, 1);
        res.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
      }
      return res;
    }

    function computeRowGross(entry, congeRateForMonth) {
      var base = Number(state.baseRate);
      var bonus = Number(state.hourlyBonus);
      var rateWithBonus = base + bonus;
      var otBaseRate = base * (1 + Number(state.otSupplementPct) / 100) + (state.includeBonusInOt ? bonus : 0);

      if (entry.type === 'baixa' || entry.type === 'recupera') return { gross: 0, otGross: 0, bonusTotal: 0, baseOnly: 0, hoursCounted: 0 };
      if (entry.type === 'conge') {
        var hc = Number(entry.normalH || state.standardDailyHours);
        return { gross: hc * congeRateForMonth, otGross: 0, bonusTotal: 0, baseOnly: 0, hoursCounted: hc };
      }
      if (entry.type === 'feriado_chome') {
        var hf = Number(entry.normalH || state.standardDailyHours);
        var rf = base + (state.includeBonusInUnworkedHoliday ? bonus : 0);
        return { gross: hf * rf, otGross: 0, bonusTotal: state.includeBonusInUnworkedHoliday ? hf * bonus : 0, baseOnly: hf * base, hoursCounted: hf };
      }
      if (entry.type === 'feriado_trab') {
        var ht = Number(entry.normalH || state.standardDailyHours);
        var holChome = ht * (base + (state.includeBonusInUnworkedHoliday ? bonus : 0));
        var worked = ht * rateWithBonus;
        var maj100 = ht * base * (Number(state.holidaySupplementPct) / 100);
        return { gross: holChome + worked + maj100, otGross: maj100, bonusTotal: ht * bonus * 2, baseOnly: ht * base * 2, hoursCounted: ht };
      }

      var nh = Number(entry.normalH || 0);
      var eh = entry.otMode === 'pay' ? Number(entry.extraH || 0) : 0;
      var nightH = Number(entry.nightH || 0);
      var sunH = Number(entry.sundayH || 0);

      var normalPay = nh * rateWithBonus;
      var otPay = eh * otBaseRate;
      var nightPay = nightH * base * (Number(state.nightSupplementPct) / 100);
      var sunPay = sunH * base * (Number(state.sundaySupplementPct) / 100);
      var bonusTotal = (nh * bonus) + (state.includeBonusInOt ? eh * bonus : 0);

      return { gross: normalPay + otPay + nightPay + sunPay, otGross: otPay + nightPay + sunPay, bonusTotal: bonusTotal, baseOnly: nh * base, hoursCounted: nh + eh };
    }

    function getCongeRateDetails(ym) {
      var prev3 = getPrevious3Months(ym);
      var totalGross = 0, totalHours = 0;
      prev3.forEach(function(m) {
        var list = state.entries[m] || [];
        list.forEach(function(e) {
          var r = computeRowGross(e, Number(state.manualCongeRate));
          totalGross += r.gross;
          totalHours += r.hoursCounted;
        });
      });
      var isAuto = totalHours >= 24;
      var rate = isAuto ? +(totalGross / totalHours).toFixed(2) : Number(state.manualCongeRate);
      return { rate: rate, isAuto: isAuto, totalGross: +totalGross.toFixed(2), totalHours: +totalHours.toFixed(2), prev3: prev3 };
    }

    function getEffectiveMonthEntries(ym) {
      var manual = (state.entries[ym] || []).slice();
      var year = Number(ym.split('-')[0]);
      var holidays = getPublicHolidays(year, state.country).filter(function(h) { return h.date.indexOf(ym) === 0; });

      if (state.autoPayUnworkedHolidays) {
        holidays.forEach(function(h) {
          var dow = new Date(h.date + 'T12:00:00').getDay();
          var already = manual.some(function(e) { return e.date === h.date; });
          if (!already && dow >= 1 && dow <= 5) {
            manual.push({
              date: h.date, type: 'feriado_chome', start: '-', end: '-',
              breakMin: 0, normalH: state.standardDailyHours, extraH: 0, nightH: 0, sundayH: 0,
              otMode: 'pay', expense: 0, note: h.name, isAutoHoliday: true
            });
          }
        });
      }
      return manual.sort(function(a, b) { return a.date.localeCompare(b.date); });
    }

    function calculateMonthSummary(ym) {
      var profile = state.countryProfiles[state.country];
      var congeInfo = getCongeRateDetails(ym);
      var congeRate = congeInfo.rate;
      var list = getEffectiveMonthEntries(ym);

      var totalGross = Number(state.extraMonthlyBonusGross || 0);
      var totalOtAndSupplements = 0, totalBonusEarned = 0, totalBaseOnly = 0;
      var totalNormalHours = 0, totalPaidExtraHours = 0;
      var workedDaysForVouchers = 0, congeDaysCount = 0;
      var unworkedHolidayHours = 0, unworkedHolidayPay = 0, totalExpensesReimb = 0;

      list.forEach(function(e) {
        var r = computeRowGross(e, congeRate);
        totalGross += r.gross;
        totalOtAndSupplements += r.otGross;
        totalBonusEarned += r.bonusTotal;
        totalBaseOnly += r.baseOnly;
        totalExpensesReimb += Number(e.expense || 0);

        if (e.type === 'work' || e.type === 'feriado_trab') {
          totalNormalHours += Number(e.normalH || 0);
          workedDaysForVouchers++;
          if (e.otMode === 'pay') totalPaidExtraHours += Number(e.extraH || 0);
        } else if (e.type === 'conge') {
          congeDaysCount++;
        } else if (e.type === 'feriado_chome') {
          unworkedHolidayHours += Number(e.normalH || state.standardDailyHours);
          unworkedHolidayPay += r.gross;
        }
      });

      var yearStr = ym.split('-')[0];
      var annualCongeUsed = 0, totalReposBankHours = 0;
      Object.keys(state.entries).forEach(function(mKey) {
        (state.entries[mKey] || []).forEach(function(item) {
          if (mKey.indexOf(yearStr) === 0 && item.type === 'conge') annualCongeUsed++;
          if (item.otMode === 'bank') totalReposBankHours += Number(item.extraH || 0);
          if (item.type === 'recupera') totalReposBankHours -= Number(item.normalH || state.standardDailyHours);
        });
      });

      var regularGross = Math.max(0, totalGross - totalOtAndSupplements);
      var deductionBreakdown = [];
      var totalSocialDeductions = 0;

      profile.deductions.forEach(function(d) {
        var base = d.onOt ? totalGross : regularGross;
        if (d.allowance) base = Math.max(0, totalGross - Number(d.allowance));
        var val = +(base * (Number(d.rate) / 100)).toFixed(2);
        totalSocialDeductions += val;
        deductionBreakdown.push({ label: d.label, rate: d.rate, amount: val });
      });

      var taxableGross = profile.otTaxExempt ? Math.max(0, regularGross - totalSocialDeductions) : Math.max(0, totalGross - totalSocialDeductions);
      var estimatedTax = +(taxableGross * (Number(profile.taxRate) / 100)).toFixed(2);
      var vouchersCount = Math.min(Number(profile.mealVoucherMax || 0), workedDaysForVouchers);
      var voucherDeduction = +(vouchersCount * Number(profile.mealVoucherCost || 0)).toFixed(2);
      var cis = Number(profile.cisCredit || 0);
      var netSalary = +(totalGross - totalSocialDeductions - estimatedTax - voucherDeduction + cis + totalExpensesReimb).toFixed(2);

      var yearHolidays = getPublicHolidays(Number(yearStr), state.country);
      var weekendHolidays = yearHolidays.filter(function(h) {
        var dow = new Date(h.date + 'T12:00:00').getDay();
        return dow === 0 || dow === 6;
      });

      var fixedExp = 0, varExp = 0, savExp = 0;
      (state.expensesList || []).forEach(function(x) {
        var v = Number(x.amount || 0);
        if (x.category === 'fixa') fixedExp += v;
        else if (x.category === 'poupanca') savExp += v;
        else varExp += v;
      });
      var totalOutflows = +(fixedExp + varExp + savExp).toFixed(2);
      var freeCash = +(netSalary - totalOutflows).toFixed(2);
      var totalWorkedH = Math.max(1, totalNormalHours + totalPaidExtraHours);
      var netPerWorkedHour = +(netSalary / totalWorkedH).toFixed(2);

      return {
        list: list, congeRate: congeRate, congeInfo: congeInfo,
        totalGross: +totalGross.toFixed(2), totalBaseOnly: +totalBaseOnly.toFixed(2),
        totalOtAndSupplements: +totalOtAndSupplements.toFixed(2), totalBonusEarned: +totalBonusEarned.toFixed(2),
        totalNormalHours: +totalNormalHours.toFixed(2), totalPaidExtraHours: +totalPaidExtraHours.toFixed(2),
        annualCongeRemaining: Math.max(0, Number(state.annualCongeQuota) - annualCongeUsed),
        totalReposBankHours: +totalReposBankHours.toFixed(2),
        congeDaysCount: congeDaysCount, unworkedHolidayHours: unworkedHolidayHours,
        unworkedHolidayPay: +unworkedHolidayPay.toFixed(2), deductionBreakdown: deductionBreakdown,
        totalSocialDeductions: +totalSocialDeductions.toFixed(2), estimatedTax: estimatedTax,
        vouchersCount: vouchersCount, voucherDeduction: voucherDeduction, cis: cis,
        totalExpensesReimb: +totalExpensesReimb.toFixed(2), netSalary: netSalary,
        weekendHolidays: weekendHolidays, yearHolidays: yearHolidays,
        fixedExp: fixedExp, varExp: varExp, savExp: savExp, totalOutflows: totalOutflows,
        freeCash: freeCash, netPerWorkedHour: netPerWorkedHour
      };
    }

    function updateLiveClockDisplay() {
      var el = document.getElementById('liveClockBox');
      if (!el || !state.liveClock.running) return;
      var now = Date.now();
      var currentPauseMs = state.liveClock.paused ? (now - state.liveClock.pauseStartMs) : 0;
      var totalPauseMs = (state.liveClock.accumulatedPauseMs || 0) + currentPauseMs;
      var netWorkMs = Math.max(0, (now - state.liveClock.startTimeMs) - totalPauseMs);

      var elapsedSec = Math.floor(netWorkMs / 1000);
      var hrs = Math.floor(elapsedSec / 3600);
      var mins = Math.floor((elapsedSec % 3600) / 60);
      var secs = elapsedSec % 60;
      var pauseMins = Math.floor(totalPauseMs / 60000);

      var elapsedHoursDec = elapsedSec / 3600;
      var normalRate = Number(state.baseRate) + Number(state.hourlyBonus);
      var otRate = Number(state.baseRate) * (1 + Number(state.otSupplementPct) / 100) + (state.includeBonusInOt ? Number(state.hourlyBonus) : 0);
      var earned = elapsedHoursDec <= state.standardDailyHours
        ? elapsedHoursDec * normalRate
        : (state.standardDailyHours * normalRate) + ((elapsedHoursDec - state.standardDailyHours) * otRate);
      var pct = Math.min(100, Math.round((elapsedHoursDec / state.standardDailyHours) * 100));

      el.innerHTML = '<div class="row"><div><div style="font-size:22px;font-weight:900;font-family:monospace;color:#38bdf8;">' +
        String(hrs).padStart(2,'0') + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0') +
        '</div><div class="subtext">' + (state.liveClock.paused ? '☕ EM PAUSA' : '🟢 Ativo') + ' • Pausa: ' + pauseMins + 'm</div></div>' +
        '<div style="text-align:right;"><div style="font-size:21px;font-weight:900;color:#10b981;">+' + earned.toFixed(3) + ' €</div>' +
        '<div class="subtext">' + pct + '% da meta diária</div></div></div>';
    }
    setInterval(updateLiveClockDisplay, 1000);

    window.startLiveClock = function() {
      state.liveClock = { running: true, paused: false, startTimeMs: Date.now(), pauseStartMs: null, accumulatedPauseMs: 0 };
      saveState();
    };
    window.togglePauseLiveClock = function() {
      if (!state.liveClock.running) return;
      if (!state.liveClock.paused) {
        state.liveClock.paused = true; state.liveClock.pauseStartMs = Date.now();
      } else {
        state.liveClock.accumulatedPauseMs += (Date.now() - state.liveClock.pauseStartMs);
        state.liveClock.paused = false; state.liveClock.pauseStartMs = null;
      }
      saveState();
    };
    window.stopLiveClock = function() {
      if (!state.liveClock.running) return;
      var now = Date.now();
      if (state.liveClock.paused && state.liveClock.pauseStartMs) state.liveClock.accumulatedPauseMs += (now - state.liveClock.pauseStartMs);
      var startDt = new Date(state.liveClock.startTimeMs);
      var endDt = new Date(now);
      var todayISO = fmtISO(startDt);
      var startStr = startDt.toTimeString().slice(0, 5);
      var endStr = endDt.toTimeString().slice(0, 5);
      var recBreak = Math.round((state.liveClock.accumulatedPauseMs || 0) / 60000);
      var effBreak = recBreak > 0 ? recBreak : state.defaultBreakMin;
      var calc = calcShiftFromTimes(startStr, endStr, effBreak, state.standardDailyHours, todayISO);
      state.form = Object.assign({}, state.form, { date: todayISO, type: 'work', start: startStr, end: endStr, breakMin: effBreak, normalH: calc.normalH, extraH: calc.extraH, nightH: calc.nightH, sundayH: calc.sundayH });
      state.liveClock = { running: false, paused: false, startTimeMs: null, pauseStartMs: null, accumulatedPauseMs: 0 };
      window.saveEntry();
    };

      else if (mode === 'work9') state.entries[ym].push({ date: dateStr, type: 'work', start: '07:00', end: '16:30', breakMin: state.defaultBreakMin, normalH: 8, extraH: 1, nightH: 0, sundayH: 0, otMode: 'pay', expense: 0, note: '🚛 Distribuição (+1h)' });
      else if (mode === 'conge') state.entries[ym].push({ date: dateStr, type: 'conge', start: '-', end: '-', breakMin: 0, normalH: 8, extraH: 0, nightH: 0, sundayH: 0, otMode: 'pay', expense: 0, note: '🏖️ Férias (Congé)' });
      else if (mode === 'feriado_trab') state.entries[ym].push({ date: dateStr, type: 'feriado_trab', start: '07:00', end: '15:30', breakMin: state.defaultBreakMin, normalH: 8, extraH: 0, nightH: 0, sundayH: 0, otMode: 'pay', expense: 0, note: '🎉 Feriado Trabalhado' });

    window.applyQuickTemplate = function(tpl) {

      else if (tpl === 'feriado_trab') { state.form.type = 'feriado_trab'; state.form.normalH = state.standardDailyHours; state.form.extraH = 0; }
      if (state.form.type === 'work') {
        var calc = calcShiftFromTimes(state.form.start, state.form.end, state.form.breakMin, state.standardDailyHours, state.form.date);

      if (found) { state.form = Object.assign({}, found); delete state.form.isAutoHoliday; }

    window.autoFillWorkweek = function() {
      var ym = state.selectedMonth;
      var parts = ym.split('-').map(Number);
      var holidays = getPublicHolidays(parts[0], state.country).map(function(h) { return h.date; });
      if (!state.entries[ym]) state.entries[ym] = [];
      var daysInMonth = new Date(parts[0], parts[1], 0).getDate();
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = ym + '-' + String(d).padStart(2, '0');
        var dow = new Date(dateStr + 'T12:00:00').getDay();
        var exists = state.entries[ym].some(function(e) { return e.date === dateStr; });
        if (dow >= 1 && dow <= 5 && holidays.indexOf(dateStr) === -1 && !exists) {
          state.entries[ym].push({
            date: dateStr, type: 'work', start: '07:00', end: '15:30',
            breakMin: state.defaultBreakMin, normalH: state.standardDailyHours,
            extraH: 0, nightH: 0, sundayH: 0, otMode: 'pay', expense: 0, note: '🚛 Distribuição'
          });

            <div style="background:var(--card-alt); padding:10px 12px; border-radius:14px; border-left:4px solid var(--success);">
              <div class="subtext">${t.netEst}</div>
              <div class="kpi-val" style="color:var(--success);">${summary.netSalary.toFixed(2)} €</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${goalPct}%; background:var(--success);"></div></div>
              <div class="subtext" style="font-size:10px; margin-top:4px;">${goalPct}% da meta (${state.monthlyNetGoal} €)</div>
            </div>
            <div style="background:var(--card-alt); padding:10px 12px; border-radius:14px; border-left:4px solid var(--primary);">
              <div class="subtext">${t.grossTot}</div>
              <div class="kpi-val">${summary.totalGross.toFixed(2)} €</div>
              <div class="subtext" style="font-size:10px; color:#7dd3fc; margin-top:4px;">Prémio 2,60€: +${summary.totalBonusEarned.toFixed(2)} €</div>
            </div>
            <div style="background:var(--card-alt); padding:10px 12px; border-radius:14px; border-left:4px solid var(--warning);">
              <div class="subtext">${t.conge3m}</div>
              <div class="kpi-val" style="color:#fcd34d;">${summary.congeRate.toFixed(2)} €/h</div>
              <div class="subtext" style="font-size:10px; margin-top:4px;">1 dia (8h) = ${(summary.congeRate * 8).toFixed(2)} €</div>
            </div>
            <div style="background:var(--card-alt); padding:10px 12px; border-radius:14px; border-left:4px solid var(--purple);">
              <div class="subtext">${t.freeCash}</div>
              <div class="kpi-val" style="color:${summary.freeCash >= 0 ? '#d8b4fe' : '#fda4af'};">${summary.freeCash.toFixed(2)} €</div>
              <div class="subtext" style="font-size:10px; margin-top:4px;">Congé: ${summary.annualCongeRemaining}d | Repos: ${summary.totalReposBankHours}h</div>
            </div>
          </div>
        </div>

        ${state.activeTab === 'registo' ? renderRegistoTab(t, summary) : ''}
        ${state.activeTab === 'calendario' ? renderCalendarioTab(t, summary) : ''}
        ${state.activeTab === 'folha' ? renderFolhaTab(t, profile, summary) : ''}
        ${state.activeTab === 'financas' ? renderFinancasTab(t, summary) : ''}
        ${state.activeTab === 'config' ? renderConfigTab(t, profile) : ''}
      `;

      document.getElementById('bottomNav').innerHTML = `
        <button onclick="setTab('registo')" class="nav-item ${state.activeTab==='registo'?'active':''}">
          <span class="nav-icon">⏱️</span><span>${t.tabs.registo}</span>
        </button>
        <button onclick="setTab('calendario')" class="nav-item ${state.activeTab==='calendario'?'active':''}">
          <span class="nav-icon">📅</span><span>${t.tabs.calendario}</span>
        </button>
        <button onclick="setTab('folha')" class="nav-item ${state.activeTab==='folha'?'active':''}">
          <span class="nav-icon">📄</span><span>${t.tabs.folha}</span>
        </button>
        <button onclick="setTab('financas')" class="nav-item ${state.activeTab==='financas'?'active':''}">
          <span class="nav-icon">💰</span><span>${t.tabs.financas}</span>
        </button>
        <button onclick="setTab('config')" class="nav-item ${state.activeTab==='config'?'active':''}">
          <span class="nav-icon">⚙️</span><span>${t.tabs.config}</span>
        </button>
      `;
    }

    function renderRegistoTab(t, summary) {
      return `
        <div class="card" style="border: 1px solid rgba(56, 189, 248, 0.28);">
          <div class="row" style="margin-bottom:8px;">
            <span style="font-size:12px; font-weight:800; color:#7dd3fc;">⏱️ ${t.liveClock}</span>
            <span class="badge bg-emerald">${(Number(state.baseRate)+Number(state.hourlyBonus)).toFixed(2)} €/h</span>
          </div>
          <div id="liveClockBox" style="margin-bottom:10px;">
            ${!state.liveClock.running ? `<div class="subtext">Inicie o turno na entrada, faça pausa no almoço e finalize na saída.</div>` : ''}
          </div>
          ${!state.liveClock.running ? `
            <button onclick="startLiveClock()" class="btn-success" style="width:100%;">${t.startShift}</button>
          ` : `
            <div class="grid-2">
              <button onclick="togglePauseLiveClock()" class="btn-warning">${state.liveClock.paused ? t.resumeShift : t.pauseShift}</button>
              <button onclick="stopLiveClock()" class="btn-danger">${t.stopShift}</button>
            </div>
          `}
        </div>

        <div class="card">
          <div class="row" style="margin-bottom:10px;">
            <span style="font-size:12px; font-weight:800; color:#38bdf8;">⚡ ${t.quickTpl}</span>
            <button onclick="autoFillWorkweek()" class="badge bg-emerald" style="border:none; cursor:pointer; padding:6px 10px;">${t.fillWeek}</button>
          </div>

          <div class="grid-4" style="margin-bottom:10px;">
            <button onclick="applyQuickTemplate('morning')" class="btn-ghost" style="padding:8px 4px; font-size:11px;">🌅 06-14:30</button>
            <button onclick="applyQuickTemplate('day9h')" class="btn-ghost" style="padding:8px 4px; font-size:11px;">🚛 07-16:30</button>
            <button onclick="applyQuickTemplate('conge')" class="btn-ghost" style="padding:8px 4px; font-size:11px; color:#fcd34d;">🏖️ Congé</button>
            <button onclick="applyQuickTemplate('feriado_trab')" class="btn-ghost" style="padding:8px 4px; font-size:11px; color:#d8b4fe;">🎉 Feriado</button>
          </div>

          <div class="grid-2" style="margin-bottom:8px;">
            <div><label>Data</label><input type="date" value="${state.form.date}" onchange="updateFormField('date', this.value)" /></div>
            <div>
              <label>Tipo de Dia</label>
              <select onchange="updateFormField('type', this.value)">
                ${Object.entries(t.types).map(function(kv) { return '<option value="' + kv[0] + '" ' + (state.form.type===kv[0]?'selected':'') + '>' + kv[1] + '</option>'; }).join('')}
              </select>
            </div>
          </div>

          <div class="grid-3" style="margin-bottom:8px;">
            <div><label>Entrada</label><input type="time" value="${state.form.start}" onchange="updateFormField('start', this.value)" /></div>
            <div><label>Saída</label><input type="time" value="${state.form.end}" onchange="updateFormField('end', this.value)" /></div>
            <div><label>Pausa (min)</label><input type="number" value="${state.form.breakMin}" onchange="updateFormField('breakMin', this.value)" /></div>
          </div>

          <div class="grid-3" style="margin-bottom:8px;">
            <div><label>Horas Normais</label><input type="number" step="0.25" value="${state.form.normalH}" onchange="updateFormField('normalH', this.value)" /></div>
            <div><label>Horas Extras</label><input type="number" step="0.25" value="${state.form.extraH}" onchange="updateFormField('extraH', this.value)" /></div>
            <div><label>Noturnas</label><input type="number" step="0.25" value="${state.form.nightH}" onchange="updateFormField('nightH', this.value)" /></div>
          </div>

          <div class="grid-2" style="margin-bottom:8px;">
            <div>
              <label>Destino Horas Extras</label>
              <select onchange="updateFormField('otMode', this.value)">
                <option value="pay" ${state.form.otMode==='pay'?'selected':''}>Pagar na Folha (+40%)</option>
                <option value="bank" ${state.form.otMode==='bank'?'selected':''}>Banco Horas (Repos)</option>
              </select>
            </div>
            <div><label>Despesas / Km (€)</label><input type="number" step="0.5" value="${state.form.expense}" onchange="updateFormField('expense', this.value)" /></div>
          </div>

          <label>Etiqueta Rápida / Nota</label>
          <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px;">
            ${QUICK_TAGS.map(function(tag) { return '<button type="button" onclick="selectQuickTag(\'' + tag + '\')" class="tag-chip ' + (state.form.note === tag ? 'active' : '') + '">' + tag + '</button>'; }).join('')}
          </div>
          <input type="text" value="${state.form.note}" placeholder="Nota da rota..." onchange="updateFormField('note', this.value)" style="margin-bottom:10px;" />

          <button onclick="saveEntry()" class="btn-primary">✓ ${state.editingDate ? t.updateDay : t.saveDay}</button>
        </div>

        <div class="card">
          <div class="row" style="margin-bottom:10px;">
            <span style="font-size:13px; font-weight:800;">Registos (${summary.list.length} dias)</span>
            <span class="subtext">Normais: <b>${summary.totalNormalHours}h</b> | Extras: <b>${summary.totalPaidExtraHours}h</b></span>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${summary.list.map(function(e) {
              var row = computeRowGross(e, summary.congeRate);
              var badgeCls = e.type.indexOf('feriado') !== -1 ? 'bg-purple' : e.type === 'conge' ? 'bg-amber' : 'bg-sky';
              return '<div class="row" style="background:var(--card-alt); padding:10px 12px; border-radius:12px;">' +
                '<div onclick="editEntryFromList(\'' + e.date + '\')" style="flex:1; cursor:pointer;">' +
                '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">' +
                '<span style="font-weight:800; font-size:13px;">' + e.date.slice(8,10) + '/' + e.date.slice(5,7) + '</span>' +
                '<span class="badge ' + badgeCls + '">' + (t.types[e.type] || e.type) + '</span>' +
                (Number(e.extraH) > 0 ? '<span class="badge bg-emerald">+' + e.extraH + 'h ext</span>' : '') +
                '</div><div class="subtext" style="margin-top:3px;">' + e.start + ' - ' + e.end + ' • ' + e.normalH + 'h ' + (e.note ? '• ' + e.note : '') + '</div></div>' +
                '<div style="text-align:right; display:flex; align-items:center; gap:8px;">' +
                '<div style="font-weight:900; color:var(--success); font-size:14px;">+' + row.gross.toFixed(2) + ' €</div>' +
                (!e.isAutoHoliday ? '<button onclick="deleteEntry(\'' + e.date + '\')" class="btn-danger" style="padding:6px 9px; font-size:11px;">✕</button>' : '') +
                '</div></div>';
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCalendarioTab(t, summary) {
      var parts = state.selectedMonth.split('-').map(Number);
      var y = parts[0], m = parts[1];
      var startOffset = new Date(y, m - 1, 1).getDay() - 1;
      if (startOffset < 0) startOffset = 6;
      var daysInMonth = new Date(y, m, 0).getDate();
      var mapEntries = {};
      summary.list.forEach(function(e) { mapEntries[e.date] = e; });

      var cells = [];
      for (var i = 0; i < startOffset; i++) cells.push('<div class="cal-day empty"></div>');
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = state.selectedMonth + '-' + String(d).padStart(2, '0');
        var entry = mapEntries[dateStr];
        var tagHtml = '';
        if (entry) {
          if (entry.type === 'conge') tagHtml = '<div class="cal-tag bg-amber">Congé</div>';
          else if (entry.type.indexOf('feriado') !== -1) tagHtml = '<div class="cal-tag bg-purple">Feriado</div>';
          else if (entry.type === 'work') tagHtml = '<div class="cal-tag bg-emerald">' + entry.normalH + 'h' + (Number(entry.extraH)>0 ? '+'+entry.extraH : '') + '</div>';
          else tagHtml = '<div class="cal-tag bg-sky">' + entry.type + '</div>';
        }
        cells.push('<div onclick="handleCalendarDayClick(\'' + dateStr + '\')" class="cal-day"><div class="cal-num">' + d + '</div>' + tagHtml + '</div>');
      }

      var sm = state.calendarStampMode || 'edit';
      var dayPayUnworked = (state.standardDailyHours * (Number(state.baseRate) + (state.includeBonusInUnworkedHoliday ? Number(state.hourlyBonus) : 0))).toFixed(2);

      return `
        <div class="card">
          <div style="font-size:11px; font-weight:700; color:#7dd3fc; margin-bottom:6px;">🎨 ${t.stampTitle}</div>
          <div class="stamp-bar">
            <button onclick="setStampMode('edit')" class="stamp-btn ${sm==='edit'?'active':''}">✏️ Editar</button>
            <button onclick="setStampMode('work8')" class="stamp-btn ${sm==='work8'?'active':''}">🚛 8h</button>
            <button onclick="setStampMode('work9')" class="stamp-btn ${sm==='work9'?'active':''}">🔥 8h+1h</button>
            <button onclick="setStampMode('conge')" class="stamp-btn ${sm==='conge'?'active':''}">🏖️ Congé</button>
            <button onclick="setStampMode('feriado_trab')" class="stamp-btn ${sm==='feriado_trab'?'active':''}">🎉 Feriado</button>
            <button onclick="setStampMode('clear')" class="stamp-btn ${sm==='clear'?'active':''}">🗑️ Apagar</button>
          </div>
          <div class="cal-grid">
            <div class="cal-head">Seg</div><div class="cal-head">Ter</div><div class="cal-head">Qua</div>
            <div class="cal-head">Qui</div><div class="cal-head">Sex</div><div class="cal-head">Sáb</div><div class="cal-head">Dom</div>
            ${cells.join('')}
          </div>
        </div>

        <div class="card">
          <div class="row" style="margin-bottom:8px;">
            <div>
              <div style="font-size:14px; font-weight:800;">🎉 Feriados Oficiais (${y})</div>
              <div class="subtext">Feriado útil não trabalhado = <b style="color:var(--success);">${dayPayUnworked} €</b></div>
            </div>
            <input type="checkbox" style="width:20px; height:20px;" ${state.autoPayUnworkedHolidays?'checked':''} onchange="state.autoPayUnworkedHolidays=this.checked; saveState();" />
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${summary.yearHolidays.map(function(h) {
              var dow = new Date(h.date + 'T12:00:00').getDay();
              var isWknd = (dow === 0 || dow === 6);
              return '<div class="row" style="background:var(--card-alt); padding:8px 12px; border-radius:10px;">' +
                '<div><div style="font-weight:800; font-size:12px;">' + h.date + ' — ' + h.name + '</div></div>' +
                '<span class="badge ' + (isWknd ? 'bg-amber' : 'bg-emerald') + '">' + (isWknd ? '+1 Comp.' : '+' + dayPayUnworked + ' €') + '</span></div>';
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderFolhaTab(t, profile, summary) {
      return `
        <div class="card">
          <div class="row" style="margin-bottom:10px;">
            <div>
              <div style="font-size:16px; font-weight:900;">📄 Fiche de Salaire (${state.selectedMonth})</div>
              <div class="subtext">${profile.name} • Classe ${profile.selectedClass} (${profile.taxRate}%)</div>
            </div>
            <select onchange="setTaxClass(this.value)" style="width:auto;">
              ${profile.classes.map(function(c) { return '<option value="' + c.id + '" ' + (profile.selectedClass===c.id?'selected':'') + '>' + c.label + '</option>'; }).join('')}
            </select>
          </div>

          <div style="display:flex; flex-direction:column; gap:8px; font-size:13px;">
            <div class="row"><span>Horas Normais (${summary.totalNormalHours}h) + Prémio 2,60€</span><b>${(summary.totalNormalHours * (Number(state.baseRate)+Number(state.hourlyBonus))).toFixed(2)} €</b></div>
            <div class="row" style="color:#d8b4fe;"><span>Feriados Não Trabalhados (${summary.unworkedHolidayHours}h)</span><b>+${summary.unworkedHolidayPay.toFixed(2)} €</b></div>
            <div class="row" style="color:#fcd34d;"><span>Férias / Congé (${summary.congeDaysCount}d @ ${summary.congeRate.toFixed(2)} €/h)</span><b>+${(summary.congeDaysCount * state.standardDailyHours * summary.congeRate).toFixed(2)} €</b></div>
            <div class="row" style="color:#6ee7b7;"><span>Horas Extras (${summary.totalPaidExtraHours}h) & Suplementos</span><b>+${summary.totalOtAndSupplements.toFixed(2)} €</b></div>

            <div class="row" style="background:var(--card-alt); padding:10px 12px; border-radius:12px; font-size:15px; font-weight:900;">
              <span>TOTAL BRUTO</span><span style="color:var(--primary);">${summary.totalGross.toFixed(2)} €</span>
            </div>

            ${summary.deductionBreakdown.map(function(d) { return '<div class="row" style="color:#fda4af;"><span>- ' + d.label + ' (' + d.rate + '%)</span><span>-' + d.amount.toFixed(2) + ' €</span></div>'; }).join('')}
            <div class="row" style="color:#fda4af;"><span>- Imposto (Classe ${profile.selectedClass}: ${profile.taxRate}%)</span><span>-${summary.estimatedTax.toFixed(2)} €</span></div>
            ${summary.voucherDeduction > 0 ? '<div class="row" style="color:#fcd34d;"><span>- Chèques-Repas (' + summary.vouchersCount + 'd)</span><span>-' + summary.voucherDeduction.toFixed(2) + ' €</span></div>' : ''}
            ${summary.cis > 0 ? '<div class="row" style="color:#6ee7b7;"><span>+ Crédito Fiscal CIS</span><span>+' + summary.cis.toFixed(2) + ' €</span></div>' : ''}

            <div class="row" style="background:rgba(16,185,129,0.18); border:1px solid rgba(16,185,129,0.4); padding:14px; border-radius:14px; font-size:17px; font-weight:900; margin-top:6px;">
              <span>SALÁRIO LÍQUIDO</span><span style="color:#6ee7b7;">${summary.netSalary.toFixed(2)} €</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderFinancasTab(t, summary) {
      return `
        <div class="card">
          <div class="row" style="margin-bottom:8px;">
            <div>
              <div style="font-size:16px; font-weight:900;">💰 Controlo de Dinheiros</div>
              <div class="subtext">Cada hora líquida trabalhada rende <b>${summary.netPerWorkedHour.toFixed(2)} €/h</b></div>
            </div>
            <span class="badge bg-emerald">Líquido: ${summary.netSalary.toFixed(2)} €</span>
          </div>
          <div class="grid-3" style="margin:10px 0; text-align:center;">
            <div style="background:var(--card-alt); padding:10px; border-radius:12px;"><div class="subtext">Fixas</div><div style="font-size:15px; font-weight:900; color:#fda4af;">-${summary.fixedExp.toFixed(0)} €</div></div>
            <div style="background:var(--card-alt); padding:10px; border-radius:12px;"><div class="subtext">Variáveis</div><div style="font-size:15px; font-weight:900; color:#fcd34d;">-${summary.varExp.toFixed(0)} €</div></div>
            <div style="background:var(--card-alt); padding:10px; border-radius:12px;"><div class="subtext">Poupança</div><div style="font-size:15px; font-weight:900; color:#6ee7b7;">${summary.savExp.toFixed(0)} €</div></div>
          </div>
          <div class="row" style="background:var(--card-alt); padding:12px; border-radius:12px;">
            <span>Saldo Livre Disponível</span>
            <b style="font-size:18px; color:#6ee7b7;">${summary.freeCash.toFixed(2)} €</b>
          </div>
        </div>

        <div class="card">
          <div class="grid-3" style="margin-bottom:8px;">
            <div><label>Descrição</label><input type="text" value="${state.newExpense.name}" onchange="state.newExpense.name=this.value" /></div>
            <div>
              <label>Tipo</label>
              <select onchange="state.newExpense.category=this.value">
                <option value="fixa">Fixa</option><option value="variavel">Variável</option><option value="poupanca">Poupança</option>
              </select>
            </div>
            <div><label>Valor (€)</label><input type="number" value="${state.newExpense.amount}" onchange="state.newExpense.amount=this.value" /></div>
          </div>
          <button onclick="addExpenseItem()" class="btn-primary" style="margin-bottom:10px;">+ Adicionar ao Orçamento</button>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${(state.expensesList || []).map(function(item) {
              var hCost = (Number(item.amount) / Math.max(1, summary.netPerWorkedHour)).toFixed(1);
              return '<div class="row" style="background:var(--card-alt); padding:9px 12px; border-radius:10px;">' +
                '<div><div style="font-weight:800; font-size:13px;">' + item.name + '</div><div class="subtext">Custa ' + hCost + 'h de trabalho</div></div>' +
                '<div style="display:flex; align-items:center; gap:8px;"><b>' + Number(item.amount).toFixed(2) + ' €</b>' +
                '<button onclick="deleteExpenseItem(' + item.id + ')" class="btn-danger" style="padding:4px 8px;">✕</button></div></div>';
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderConfigTab(t, profile) {
      return `
        <div class="card">
          <div class="row" style="margin-bottom:10px;">
            <span style="font-size:14px; font-weight:800; color:#38bdf8;">⚙️ Salário, Prémio 2,60€ & Classe</span>
            <button onclick="applyIndex25()" class="badge bg-amber" style="border:none;">+2,5% Index</button>
          </div>
          <div class="grid-2" style="margin-bottom:8px;">
            <div>
              <label>País</label>
              <select onchange="setCountry(this.value)">
                ${Object.keys(state.countryProfiles).map(function(c) { return '<option value="' + c + '" ' + (state.country===c?'selected':'') + '>' + state.countryProfiles[c].name + '</option>'; }).join('')}
              </select>
            </div>
            <div>
              <label>Classe de Imposto</label>
              <select onchange="setTaxClass(this.value)">
                ${profile.classes.map(function(c) { return '<option value="' + c.id + '" ' + (profile.selectedClass===c.id?'selected':'') + '>' + c.label + '</option>'; }).join('')}
              </select>

          </div>
          <div class="grid-2" style="margin-bottom:8px;">

          </div>
          <div class="grid-3">
            <div><label>Imposto (%)</label><input type="number" step="0.1" value="${profile.taxRate}" onchange="state.countryProfiles[state.country].taxRate=Number(this.value); saveState();" /></div>
            <div><label>Congé Manual (€/h)</label><input type="number" step="0.01" value="${state.manualCongeRate}" onchange="state.manualCongeRate=Number(this.value); saveState();" /></div>
            <div>
              <label>Arredondar</label>
              <select onchange="state.roundingMinutes=Number(this.value); saveState();">
                <option value="0" ${state.roundingMinutes===0?'selected':''}>Exato</option>
                <option value="5" ${state.roundingMinutes===5?'selected':''}>5 min</option>
                <option value="15" ${state.roundingMinutes===15?'selected':''}>15 min</option>
                <option value="30" ${state.roundingMinutes===30?'selected':''}>30 min</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card">
          <div style="font-size:14px; font-weight:800; color:#6ee7b7; margin-bottom:8px;">🏛️ Descontos (${profile.name})</div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${profile.deductions.map(function(d, idx) {
              return '<div class="row" style="background:var(--card-alt); padding:8px 12px; border-radius:10px;">' +
                '<span style="font-size:12px;">' + d.label + '</span>' +
                '<input type="number" step="0.05" value="' + d.rate + '" onchange="state.countryProfiles[state.country].deductions[' + idx + '].rate=Number(this.value); saveState();" style="width:80px; text-align:right;" /></div>';
            }).join('')}
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
