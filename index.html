<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob: gap:; style-src * 'self' 'unsafe-inline'; script-src * 'self' 'unsafe-inline' 'unsafe-eval';" />
  <title>LuxTime Pro v6.1</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #141d2f;
      --card-hover: #1b263d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #f43f5e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 96px;
      overflow-x: hidden;
    }
    .container { max-width: 600px; margin: 0 auto; padding: 14px; }
    
    .top-pill-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .pill-badge {
      background: var(--card); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 99px; font-size: 11px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 5px; color: var(--text);
    }
    .pill-badge.accent { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
    .pill-badge.warning { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }

    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .metric-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .metric-title { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
    .metric-value { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
    .metric-sub { font-size: 10px; color: var(--muted); margin-top: 5px; }

    .card-box {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 16px; margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
    input, select, textarea {
      width: 100%; background: #0f172a; color: var(--text);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
      padding: 11px 13px; font-size: 13px; font-weight: 700; outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    button {
      border: none; border-radius: 14px; padding: 12px 14px;
      font-size: 13px; font-weight: 800; cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #38bdf8, #0284c7); color: #082f49; width: 100%; }
    .btn-success { background: linear-gradient(135deg, #34d399, #059669); color: #022c22; width: 100%; }
    .btn-ghost { background: var(--card-hover); color: var(--text); border: 1px solid var(--border); width: 100%; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11, 15, 25, 0.98); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
      z-index: 999;
    }
    .nav-item {
      background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px; border-radius: 12px; font-size: 10px; font-weight: 700;
    }
    .nav-item.active { color: var(--primary); background: rgba(56, 189, 248, 0.12); }
    .nav-icon { font-size: 19px; line-height: 1; }
    .progress-bar { width: 100%; height: 7px; background: #070b14; border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: var(--success); border-radius: 99px; }
  </style>
</head>
<body>
  <div id="app" class="container"></div>
  <nav id="bottomNav" class="bottom-nav"></nav>

  <script>
    var defaultState = {
      activeTab: 'registo', selectedMonth: '2026-11', country: 'LU',
      baseRate: 17.50, hourlyBonus: 2.60, manualCongeRate: 21.80, monthlyNetGoal: 3400,
      entries: {
        "2026-11": [{ date: "2026-11-04", type: "work", start: "07:00", end: "16:30", breakMin: 30, normalH: 8, extraH: 1, expense: 0, note: "Distribuição" }]
      },
      form: { date: "2026-11-04", type: "work", start: "07:00", end: "16:30", breakMin: 30, normalH: 8, extraH: 1, note: "" },
      expensesList: [{ id: 1, name: "Casa / Habitação", category: "fixa", amount: 1150 }]
    };

    var loaded = null;
    try { loaded = JSON.parse(localStorage.getItem('luxtime_v6_1') || 'null'); } catch(e){}
    var state = Object.assign({}, defaultState, loaded || {});

    function saveState() {
      try { localStorage.setItem('luxtime_v6_1', JSON.stringify(state)); } catch(e){}
      render();
    }

    function calculateMonthSummary() {
      var list = state.entries[state.selectedMonth] || [];
      var totalGross = 0, totalNorm = 0, totalExtra = 0, workDays = 0;
      var bonusRate = Number(state.hourlyBonus);
      var base = Number(state.baseRate);

      list.forEach(function(e) {
        var hNorm = Number(e.normalH || 0);
        var hExt = Number(e.extraH || 0);
        if (e.type === 'work') {
          totalNorm += hNorm; totalExtra += hExt; workDays++;
          totalGross += (hNorm * (base + bonusRate)) + (hExt * (base * 1.4 + bonusRate));
        } else if (e.type === 'conge') {
          totalGross += Number(state.manualCongeRate) * 8;
        }
      });

      var totalDeductions = totalGross * 0.1225; // Pensões + Doença + Dependência aprox.
      var tax = Math.max(0, totalGross - totalDeductions) * 0.075;
      var net = totalGross - totalDeductions - tax + 50;

      var fixed = 0;
      (state.expensesList || []).forEach(function(x) { fixed += Number(x.amount); });
      var freeCash = net - fixed;

      return {
        list: list, totalGross: +totalGross.toFixed(2), netSalary: +net.toFixed(2),
        freeCash: +freeCash.toFixed(2), congeRate: Number(state.manualCongeRate),
        totalBonus: +((totalNorm + totalExtra) * bonusRate).toFixed(2)
      };
    }

    window.setTab = function(tab) { state.activeTab = tab; saveState(); };
    window.setMonth = function(m) { state.selectedMonth = m; state.form.date = m + '-04'; saveState(); };
    window.saveEntry = function() {
      var ym = state.selectedMonth;
      if (!state.entries[ym]) state.entries[ym] = [];
      state.entries[ym] = state.entries[ym].filter(function(e) { return e.date !== state.form.date; });
      state.entries[ym].push(Object.assign({}, state.form));
      saveState();
      alert("Registo guardado com sucesso!");
    };

    function render() {
      var summary = calculateMonthSummary();
      var goalPct = Math.min(100, Math.round((summary.netSalary / state.monthlyNetGoal) * 100));

      document.getElementById('app').innerHTML = `
        <div class="top-pill-bar">
          <div class="pill-badge accent">Luxemburgo 🇱🇺</div>
          <div class="pill-badge warning">Classe 2</div>
          <div class="pill-badge">+2.60 €/h</div>
          <div style="margin-left:auto;">
            <input type="month" value="${state.selectedMonth}" onchange="setMonth(this.value)" style="width:auto; padding:5px 8px; font-size:11px;" />
          </div>
        </div>

        <div class="metric-grid">
          <div class="metric-card" style="border-left: 4px solid var(--success);">
            <div class="metric-title">Líquido Estimado</div>
            <div class="metric-value" style="color:var(--success);">${summary.netSalary.toFixed(2)} €</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${goalPct}%;"></div></div>
            <div class="metric-sub">${goalPct}% da meta (${state.monthlyNetGoal} €)</div>
          </div>

          <div class="metric-card" style="border-left: 4px solid var(--primary);">
            <div class="metric-title">Total Bruto</div>
            <div class="metric-value">${summary.totalGross.toFixed(2)} €</div>
            <div class="metric-sub" style="color:#7dd3fc;">Prémio: +${summary.totalBonus.toFixed(2)} €</div>
          </div>

          <div class="metric-card" style="border-left: 4px solid var(--warning);">
            <div class="metric-title">Média Congé 3M</div>
            <div class="metric-value" style="color:#fcd34d;">${summary.congeRate.toFixed(2)} €/h</div>
            <div class="metric-sub">1 dia (8h) = ${(summary.congeRate * 8).toFixed(2)} €</div>
          </div>

          <div class="metric-card" style="border-left: 4px solid var(--purple);">
            <div class="metric-title">Saldo Livre Mês</div>
            <div class="metric-value" style="color:${summary.freeCash >= 0 ? '#d8b4fe' : '#fda4af'};">${summary.freeCash.toFixed(2)} €</div>
            <div class="metric-sub">Congé: 26d | Repos: 0h</div>
          </div>
        </div>

        ${state.activeTab === 'registo' ? renderRegisto(summary) : ''}
        ${state.activeTab === 'calendario' ? `<div class="card-box"><h3>📅 Calendário</h3><p class="subtext">Turnos registados: ${summary.list.length}</p></div>` : ''}
        ${state.activeTab === 'folha' ? `<div class="card-box"><h3>📄 Salário</h3><p class="subtext">Líquido: ${summary.netSalary} €</p></div>` : ''}
        ${state.activeTab === 'financas' ? `<div class="card-box"><h3>💰 Dinheiros</h3><p class="subtext">Saldo livre: ${summary.freeCash} €</p></div>` : ''}
        ${state.activeTab === 'config' ? `<div class="card-box"><h3>⚙️ Ajustes</h3><p class="subtext">Base: ${state.baseRate} €/h | Prémio: ${state.hourlyBonus} €/h</p></div>` : ''}
      `;

      document.getElementById('bottomNav').innerHTML = `
        <button onclick="setTab('registo')" class="nav-item ${state.activeTab==='registo'?'active':''}">
          <span class="nav-icon">⏱️</span><span>Ponto</span>
        </button>
        <button onclick="setTab('calendario')" class="nav-item ${state.activeTab==='calendario'?'active':''}">
          <span class="nav-icon">📅</span><span>Calendário</span>
        </button>
        <button onclick="setTab('folha')" class="nav-item ${state.activeTab==='folha'?'active':''}">
          <span class="nav-icon">📄</span><span>Salário</span>
        </button>
        <button onclick="setTab('financas')" class="nav-item ${state.activeTab==='financas'?'active':''}">
          <span class="nav-icon">💰</span><span>Dinheiros</span>
        </button>
        <button onclick="setTab('config')" class="nav-item ${state.activeTab==='config'?'active':''}">
          <span class="nav-icon">⚙️</span><span>Ajustes</span>
        </button>
      `;
    }

    function renderRegisto(summary) {
      return `
        <div class="card-box">
          <div style="font-size:13px; font-weight:800; color:var(--primary); margin-bottom:10px;">⚡ Registo de Ponto</div>
          <div class="grid-2" style="margin-bottom:8px;">
            <div><label>Data</label><input type="date" value="${state.form.date}" onchange="state.form.date=this.value" /></div>
            <div>
              <label>Tipo</label>
              <select onchange="state.form.type=this.value">
                <option value="work" ${state.form.type==='work'?'selected':''}>Trabalho Normal</option>
                <option value="conge" ${state.form.type==='conge'?'selected':''}>Férias (Congé)</option>
              </select>
            </div>
          </div>
          <div class="grid-3" style="margin-bottom:12px;">
            <div><label>Entrada</label><input type="time" value="${state.form.start}" onchange="state.form.start=this.value" /></div>
            <div><label>Saída</label><input type="time" value="${state.form.end}" onchange="state.form.end=this.value" /></div>
            <div><label>Extras (h)</label><input type="number" step="0.5" value="${state.form.extraH}" onchange="state.form.extraH=this.value" /></div>
          </div>
          <button onclick="saveEntry()" class="btn-success">✓ Guardar Registo</button>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
