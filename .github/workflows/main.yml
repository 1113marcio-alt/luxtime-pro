name: Gerar APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ler ficheiros do repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Criar e Compilar o APK Desbloqueado
        shell: bash
        run: |
          set +o pipefail
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          npm install -g cordova
          cordova telemetry off || true
          cordova create app com.luxtime.pro "LuxTimePro"
          
          # Copiar o ficheiro HTML do repositorio e remover bloqueios CSP do Cordova
          HTML_FILE=$(find . -maxdepth 2 -iname "*.html" ! -path "./app/*" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" app/www/index.html
            sed -i '/Content-Security-Policy/d' app/www/index.html
            sed -i 's/<head>/<head><meta http-equiv="Content-Security-Policy" content="default-src * self blob: data: gap:; style-src * self '\''unsafe-inline'\'' blob: data: gap:; script-src * '\''self'\'' '\''unsafe-eval'\'' '\''unsafe-inline'\'' blob: data: gap:; object-src * '\''self'\'' blob: data: gap:; img-src * self '\''unsafe-inline'\'' blob: data: gap:; connect-src self * '\''unsafe-inline'\'' blob: data: gap:; frame-src * self blob: data: gap:;">/i' app/www/index.html
          fi

          # Permitir acesso total no config.xml do Android
          sed -i 's/<\/widget>/<allow-navigation href="*" \/><allow-intent href="*" \/><access origin="*" \/><preference name="AndroidInsecureFileModeEnabled" value="true" \/><\/widget>/g' app/config.xml

          cd app
          cordova platform add android@13.0.0
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../LuxTime-Pro.apk

      - name: 6. Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuxTime-Pro-APK
          path: LuxTime-Pro.apk

      - name: 7. Publicar APK na pagina Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v3.1
          name: "LuxTime Pro v3.1 (Corrigido Ecrã Azul)"
          files: LuxTime-Pro.apk
